name: Feature Request
description: Propose an enhancement or new capability
title: "[FEATURE]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Please describe the feature clearly. Include acceptance criteria and any constraints.

  - type: input
    id: area
    attributes:
      label: Target Area
      description: Which module/service is this for? (e.g., Modules/Profile, Gateway, Core/CQRS)
      placeholder: "Modules/Activity"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are we solving? Why does it matter?
      placeholder: "As a ..., I want ..., so that ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the proposed approach at a high level.
      placeholder: "Explain the approach, boundaries, and assumptions."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List measurable outcomes.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / Constraints
      description: Dependencies, risks, deadlines, or technical constraints.
      placeholder: "Add any relevant notes."
    validations:
      required: false
