name: CI

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ./Aizen.sln

      - name: Build
        run: dotnet build ./Aizen.sln --configuration Release --no-restore

  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ./Aizen.sln

      - name: Test
        shell: bash
        run: |
          set -e
          # If there are no test projects yet, do not fail CI.
          if ls **/*Tests.csproj **/*Test.csproj **/*.Tests.csproj 1> /dev/null 2>&1; then
            dotnet test ./Aizen.sln --configuration Release --no-restore --verbosity normal
          else
            echo "No test projects found. Skipping dotnet test."
          fi

  security-guards:
    name: security guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Modules trust the identity the BFF asserts. If a module is reachable from
      # outside the cluster, that trust becomes an impersonation vector.
      # See infrastructure/k8s/README.md
      - name: Modules must not publish an Ingress
        run: bash scripts/ci/assert-no-module-ingress.sh

      # Doldurulmamış "__FROM_ENV__" / "__FROM_SECRET__" yer-tutucularını yakalar (appsettings ↔ chart values).
      # ŞİMDİLİK RAPORLA-YALNIZCA (continue-on-error): bugün var olan borç temizlenmeden bloklayıcı yaparsak
      # herkesin görmezden geldiği kırmızı bir CI oluşur — o, denetimsizlikten kötüdür. Borç kapanınca
      # 'continue-on-error' satırını KALDIRIN → bloklayıcı olur.
      - name: Yapılandırma yer-tutucu denetimi (report-only)
        continue-on-error: true
        run: python3 build/ci/yer-tutucu-denetimi.py
