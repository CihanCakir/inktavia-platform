# Inktavia — container imajlarının GHCR'a inşası ve itilmesi (Faz 4/5)
#
# Bileşen listesi burada DEĞİL, build/components.json içinde. Yeni bir modül eklerken
# bu dosyaya dokunmuyorsun — tek kaynak orası.
#
# Kimlik: PAT yok. GitHub Actions'ın kendi GITHUB_TOKEN'ı `packages: write` iznini alıyor.
# Cluster'ın çekmek için ayrı ve YALNIZCA `read:packages` yetkili bir token'ı var (Sealed
# Secret olarak `ghcr-pull`). İtme yetkisi cluster'da bulunmaz.
#
# Tag sözleşmesi (roadmap §3):
#   sha-<7hex>  değişmez, deploy edilen TEK tag türü
#   develop     değişebilir, yalnız insan gözü için
#   latest      YASAK — üretilmiyor

name: images

# İki tetikleyici, iki farklı amaç:
#   pull_request → SADECE inşa eder, itmez. Amaç Dockerfile'ın derlendiğini merge'den
#                  ÖNCE öğrenmek. Bozuk bir imaj develop'a hiç ulaşmaz.
#   push:develop → inşa eder ve GHCR'a iter. Gerçek yayın yolu budur.
#
# workflow_dispatch bilerek YOK: "Run workflow" düğmesi yalnız varsayılan dalda (main)
# duran workflow'lar için görünür, main ise şu an geride. Eklemek yanıltıcı olurdu.
on:
  push:
    branches: [develop]
    # CI'ın kendi attığı sürüm-ilerletme commit'i yalnız gitops/ altını değiştirir.
    # Bu satır olmadan o commit workflow'u yeniden tetikler ve SONSUZ DÖNGÜ oluşur.
    paths-ignore:
      - 'gitops/**'
  pull_request:
    branches: [develop]

permissions:
  # contents: write — dev sürüm işaretçisini ilerleten commit için gerekli.
  contents: write
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/cihancakir/inktavia

jobs:
  prepare:
    name: etkilenen bileşenler
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Değişen dosyaları hesaplayabilmek için geçmiş gerekiyor.
          fetch-depth: 0

      - id: changed
        name: Değişen dosyalar
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            git diff --name-only "$BASE...HEAD" > changed.txt
          else
            BEFORE="${{ github.event.before }}"
            # Yeni dal veya force-push'ta 'before' ya sıfırlardan oluşur ya da artık yoktur.
            # Böyle bir durumda neyin değiştiğini bilemeyiz → temkinli davranıp hepsini derleriz.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "BİLİNMİYOR" > changed.txt
            else
              git diff --name-only "$BEFORE" "${{ github.sha }}" > changed.txt
            fi
          fi
          echo "değişen dosyalar:"; sed 's/^/  /' changed.txt

      - id: build-matrix
        name: Etkilenen bileşenleri hesapla
        run: |
          set -euo pipefail
          if grep -qx 'BİLİNMİYOR' changed.txt; then
            MATRIX=$(jq -c '{include: .components}' build/components.json)
            echo "::notice::Karşılaştırma noktası yok → tüm bileşenler derlenecek"
          else
            MATRIX=$(python3 scripts/ci/affected-components.py < changed.txt)
          fi
          COUNT=$(echo "$MATRIX" | jq '.include | length')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"   >> "$GITHUB_OUTPUT"
          {
            echo "### Etkilenen bileşenler: ${COUNT}/15"
            echo '```'
            echo "$MATRIX" | jq -r '.include[].id'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.id }}
    needs: prepare
    # Yalnız chart/doküman değiştiyse hiçbir imaj derlenmez ve iş tamamen atlanır.
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR'a giriş
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Tag'leri hesapla
        run: |
          set -euo pipefail
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          # sha-<7hex> her zaman üretilir ve DEĞİŞMEZ — deploy edilen tek tag türü budur.
          TAGS="${REGISTRY}/${{ matrix.id }}:sha-${SHA7}"
          # 'develop' yalnızca develop'a push'ta ve yalnızca insan gözü için. 'latest' asla.
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TAGS="${TAGS}"$'\n'"${REGISTRY}/${{ matrix.id }}:develop"
          fi
          echo "sha7=${SHA7}" >> "$GITHUB_OUTPUT"
          { echo 'tags<<__TAGS_EOF__'; echo "${TAGS}"; echo '__TAGS_EOF__'; } >> "$GITHUB_OUTPUT"

      - name: İnşa et ve it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          # Sunucu amd64 (Ryzen 5 1600). Bu satır olmadan runner'ın mimarisine
          # bağımlı kalırdık; elle Mac'ten build edildiğinde arm64 çıkıp
          # sunucuda "exec format error" verirdi.
          platforms: linux/amd64
          # PR'da itmiyoruz: amaç derlendiğini görmek, registry'yi yarım imajla kirletmek değil.
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          provenance: false
          build-args: |
            PROJECT=${{ matrix.project }}
            DLL=${{ matrix.dll }}
          tags: ${{ steps.meta.outputs.tags }}
          # image.source etiketi paketi repoya bağlar — GHCR'da paketin hangi repodan
          # geldiğini ve izinlerini bu belirler.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.id }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

      - name: Özet
        run: |
          {
            echo "### ${{ matrix.id }}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_yalnız derlendi, itilmedi (PR)_"
            else
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Seçici derleme yalnız değişen bileşeni üretir. Ama GitOps TEK bir sürüm
  # işaretçisi kullanıyor: `sha-<commit>`. Bu commit'te derlenmeyen bir bileşenin
  # o etiketi olmazsa Argo CD ImagePullBackOff verir.
  #
  # Çözüm: değişmeyen bileşenlerin `develop` etiketini `sha-<commit>` olarak da
  # işaretle. Bu registry tarafında MANIFEST KOPYASI — yeniden derleme yok, saniyeler.
  # Sonuç: her commit 15 bileşen için eksiksiz ve tutarlı bir etiket seti üretir,
  # deploy ve geri alma atomik kalır.
  # ───────────────────────────────────────────────────────────────────────────
  complete-tags:
    name: etiket setini tamamla
    needs: [prepare, build]
    if: >-
      always() && github.event_name == 'push' &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      sha7: ${{ steps.tag.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: |
          set -euo pipefail
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha7=$SHA7" >> "$GITHUB_OUTPUT"

          echo '${{ needs.prepare.outputs.matrix }}' | jq -r '.include[].id' | sort > built.txt
          jq -r '.components[].id' build/components.json | sort > all.txt
          comm -13 built.txt all.txt > unchanged.txt

          echo "derlenen : $(tr '\n' ' ' < built.txt)"
          echo "etiketlenecek: $(tr '\n' ' ' < unchanged.txt)"

          while read -r id; do
            [ -n "$id" ] || continue
            SRC="${REGISTRY}/${id}:develop"
            DST="${REGISTRY}/${id}:sha-${SHA7}"
            if ! docker buildx imagetools create -t "$DST" "$SRC"; then
              echo "::error::$id için '$SRC' bulunamadı. Etiket seti eksik kalır ve"
              echo "::error::Argo CD ImagePullBackOff verir. Tüm bileşenleri bir kez derleyin."
              exit 1
            fi
            echo "  $id: develop → sha-${SHA7}"
          done < unchanged.txt

      - name: Özet
        run: |
          {
            echo "### Etiket seti tamamlandı"
            echo "Tüm 15 bileşen artık \`sha-${{ steps.tag.outputs.sha7 }}\` etiketiyle mevcut."
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Dev sürüm işaretçisini ilerlet. Argo CD gitops/apps/dev-appset.yaml dosyasını
  # izliyor; bu commit'ten sonra dev ortamı kendiliğinden yeni sürüme geçer.
  #
  # PROD BİLEREK YOK: prod işaretçisini bir insan bir PR ile değiştirir. Tek node,
  # tek operatörlü bir kurulumda otomatik prod deploy, hatayı fark etmeden yayına
  # almak demektir.
  # ───────────────────────────────────────────────────────────────────────────
  bump-dev:
    name: dev sürümünü ilerlet
    needs: complete-tags
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - run: |
          set -euo pipefail
          SHA7="${{ needs.complete-tags.outputs.sha7 }}"
          F=gitops/apps/dev-appset.yaml

          CUR=$(grep -oP '(?<=value: )sha-[0-9a-f]{7}' "$F" || echo "yok")
          if [ "$CUR" = "sha-$SHA7" ]; then
            echo "dev zaten sha-$SHA7 — değişiklik yok"; exit 0
          fi

          sed -i -E "s|(^ +value: )sha-[0-9a-f]{7}\b|\1sha-${SHA7}|" "$F"
          grep -n "value: sha-" "$F"

          git config user.name  "inktavia-ci"
          git config user.email "ci@inktavia.com"
          git add "$F"
          git commit -m "chore(gitops): dev sürümü ${CUR} → sha-${SHA7}"
          git push origin develop
