# aizen-bff-adminpanel — dev değerleri (inktavia-dev)
#
# ⚠️ BU DOSYA PUBLIC BİR REPODA. Sırlar Sealed Secret'tan env olarak geliyor.
#    $(VAR) genişletmesi YALNIZ listede daha önce tanımlanmış değişkenler için çalışır.
#
# ⚠️ DEV ORTAMI. BFF'lerde PostgreSQL/Mongo yok; ayrım Redis ve RabbitMQ'da:
#   Redis    : defaultDatabase=14 (prod 13)
#   RabbitMQ : vhost /dev
#
# ASPNETCORE_ENVIRONMENT=Production BİLEREK: bu ortamın işi geliştirme değil, prod'a
# çıkmadan önce PROD DAVRANIŞINI sınamak. Development modunda BffAssertion fail-closed
# kontrolü devre dışı kalır — dev yeşil yanar, prod patlar.
#
# INGRESS KAPALI: dev BFF'leri internete açılmıyor. Erişim:
#   kubectl -n inktavia-dev port-forward deploy/aizen-bff-adminpanel 8080:8080
#

# ⚠️ replicaCount'u BURADAN yönetme. Ortamın açık/kapalı olması
# gitops/apps/{prod,dev}-appset.yaml içindeki `replicaCount` parametresinden
# geliyor ve Helm parametresi bu değerin ÜZERİNE yazıyor. Buradaki 1, chart tek
# başına çalıştırıldığında geçerli olan doğal varsayılan.
# Ortam değiştirmek için:  python3 scripts/ortam-degistir.py dev|prod
replicaCount: 1

image:
  repository: ghcr.io/cihancakir/inktavia/bff-adminpanel
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  # AÇIK — dev ana ortam olduğu için Cloudflare Tunnel üzerinden erişilebilir.
  # Host'lar dev-* ön ekli; prod host'larıyla asla karışmasın.
  # ⚠️ Yeni bir dev host'u eklersen Cloudflare'de İKİ yer güncellenmeli:
  #    1. Tünel yönlendirmesi (Published application routes)
  #    2. /info için Access uygulaması — yoksa o host'un /info'su açıkta kalır
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: dev-admin-api.inktavia.com
      paths:
        - path: /
          pathType: Prefix
  # TLS Cloudflare Tunnel'da sonlanacak (Faz 9); origin sertifikası gerekmiyor.
  tls: []

probes:
  path: /info
  startup:
    periodSeconds: 5
    failureThreshold: 24   # 2 dakika — BFF'lerde migration yok, modüllerden hızlı açılır

# BFF'ler modüllerden hafif: EF/migration yok, iş mantığı modüllerde.
# CPU tavani 250m -> 1000m (2026-09-07, LT-5): 25 VU'da CFS throttle %22 olculdu, p95'ler
# 17-32 sn'ye savruldu; node %40'ta bostu. request AYNEN kaldi — tavan sadece patlama payi.
resources:
  requests:
    cpu: 15m
    memory: 90Mi
  limits:
    cpu: 2000m  # LT-7 2026-09-09: LT-6b'de %67 CFS throttle + RedisTimeout/thread-pool acligi (#112)
    memory: 256Mi

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

env:
  # ── Sırlar ───────────────────────────────────────────────────────────────────
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: REDIS_PASSWORD }
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: RABBITMQ_PASSWORD }
  - name: KC_CLIENT_SECRET
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: KEYCLOAK_ADMIN_PANEL_BFF_CLIENT_SECRET }
  - name: BffAssertion__SharedSecret
    valueFrom:
      secretKeyRef: { name: bff-assertion, key: SharedSecret }

  # ── BFF assertion izin listesi ───────────────────────────────────────────────
  # Paylaşılan sır TEK BAŞINA yetmez ve kod bunu fail-closed reddediyor:
  #   "SharedSecret is configured but AllowedClientIds is empty. An empty allowlist
  #    would let ANY caller holding a valid service-account token assert ANY user id."
  # Doğru davranış — bu liste, sırrı bilen bir çağıranın hangi client kimliğiyle
  # gelebileceğini sınırlar. Sır sızsa bile listede olmayan bir client geçemez.
  - name: BffAssertion__AllowedClientIds__0
    value: "admin-panel-bff"
  - name: BffAssertion__AllowedClientIds__1
    value: "provider-portal-bff"
  - name: BffAssertion__AllowedClientIds__2
    value: "marine-web-bff"
  - name: BffAssertion__AllowedClientIds__3
    value: "marine-mobile-bff"

  # ── Elastic APM ──────────────────────────────────────────────────────────────
  # appsettings'te ServerUrl "__FROM_ENV__" yer tutucusuyla duruyor; ajan bunu URL
  # sanıp ayrıştırmada patlıyor ve saniyede bir 127.0.0.1:8200'e bağlanmaya çalışıyor.
  # Gözlemlenebilirlik yığını Faz 11'in işi; o zamana kadar kapalı.
  # ── Log bicimi (ELK Faz L pilotu, 2026-09-08) ────────────────────────────────
  # JSON console formatter: stdout satirlari yapilandirilmis JSON olur; Filebeat
  # decode_json_fields ile alanlara ayirir. Kod degisikligi YOK — yalniz bicim.
  # Seviyeler AYNEN korunur (Debug/Trace ACILMADI).
  - name: Logging__Console__FormatterName
    value: "json"
  - name: Logging__Console__FormatterOptions__SingleLine
    value: "true"
  - name: Logging__Console__FormatterOptions__IncludeScopes
    value: "true"
  - name: Logging__Console__FormatterOptions__TimestampFormat
    value: "yyyy-MM-ddTHH:mm:ss.fffZ"
  - name: Logging__Console__FormatterOptions__UseUtcTimestamp
    value: "true"
  # ── SQL log seli kapali (ELK olcumu 2026-09-08: Information'larin ~%78'i EF
  # "Executed DbCommand" / EventId 20101 idi; yuk testinde katlanarak buyur ve
  # olculen gecikmeye log uretim maliyeti karisir). Diger Information loglari
  # (is olaylari, Hangfire, bus) ACIK kalir. Geri almak = bu iki satiri sil.
  - name: Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command
    value: "Warning"
  # ── Thread pool tabani (LT-7, 2026-09-09): CPU limiti altinda .NET min thread'i
  # cekirdek sayisina (1-2) kurar; LT-6b'de RedisTimeoutException/thread-pool acligi
  # olculdu (WORKER Busy=14 Min=1 — borc #112). Taban 32'ye cekildi.
  - name: DOTNET_ThreadPool_MinThreads
    value: "32"
  - name: ElasticApm__Enabled
    value: "false"
  - name: ElasticApm__ServerUrl
    value: ""

  # ── Çalışma ortamı ───────────────────────────────────────────────────────────
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: TZ
    value: Europe/Istanbul

  # ── Önbellek ve mesaj kuyruğu ────────────────────────────────────────────────
  - name: DistributedCache__InstanceName
    value: "AdminPanelBff:"
  - name: DistributedCache__Configuration
    value: "redis:6379,password=$(REDIS_PASSWORD),abortConnect=False,defaultDatabase=14"
  - name: MessageBroker__QueueSettings__HostName
    value: "rabbitmq"
  - name: MessageBroker__QueueSettings__Port
    value: "5672"
  - name: MessageBroker__QueueSettings__VirtualHost
    value: "/dev"
  - name: MessageBroker__QueueSettings__UserName
    value: "aizen"
  - name: MessageBroker__QueueSettings__Password
    value: "$(RABBITMQ_PASSWORD)"

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  # ⚠️ Authority = token'daki issuer. Core/Auth/BuilderExtensions.cs içinde
  # ValidIssuer DOĞRUDAN bu değere eşitleniyor, metadata'dan türetilmiyor.
  # Keycloak issuer'ı 2026-08-18'de https://auth.inktavia.com'a sabitlendi.
  # MetadataAddress ve TokenEndpoint BİLEREK iç adreste kaldı: discovery ve JWKS
  # cluster içinden çekiliyor, token doğrulaması Cloudflare'e bağımlı değil.
  - name: AdminPanelKeycloak__BaseUrl
    value: "http://keycloak:8080"
  - name: AdminPanelKeycloak__Authority
    value: "https://auth.inktavia.com/realms/inktavia-realm"
  - name: AdminPanelKeycloak__MetadataAddress
    value: "http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration"
  - name: AdminPanelKeycloak__Realm
    value: "inktavia-realm"
  - name: AdminPanelKeycloak__Audience
    value: "admin-panel-bff"
  - name: AdminPanelKeycloak__RequireHttpsMetadata
    value: "false"
  - name: AdminPanelKeycloak__AdminClientSecret
    value: "$(KC_CLIENT_SECRET)"
  # ── BFF kimlik iddiası anahtarı (FAZ10 #31) ──────────────────────────────────
  # DelegatingHandler bu değer BOŞKEN X-Aizen-Bff-Assertion + X-Aizen-User-Id başlıklarını GÖNDERMİYORDU;
  # modüller ise aynı mühürlü secret'ı BffAssertion__SharedSecret olarak doğruluyor (prod'da boşsa açılmıyor).
  # HMAC (FixedTimeEquals) tutması için modülün SharedSecret'i ile AYNI secret'a bağlanır. Asserted user-id
  # modül tarafında UserInfo.UserId'yi doldurur (audit/CreateUserId); endpoint'ler servis token'ıyla zaten
  # çalışıyor, bu EK güvence.  (appsettings.json'da varsayılan "" idi.)
  - name: AdminPanelKeycloak__ModuleAssertionSecret
    valueFrom:
      secretKeyRef: { name: bff-assertion, key: SharedSecret }

  # ── Keycloak servis token'ı ──────────────────────────────────────────────────
  - name: KeycloakServiceToken__Authority
    value: "https://auth.inktavia.com/realms/inktavia-realm"
  - name: KeycloakServiceToken__TokenEndpoint
    value: "http://keycloak:8080/realms/inktavia-realm/protocol/openid-connect/token"
  - name: KeycloakServiceToken__ClientId
    value: "admin-panel-bff"
  - name: KeycloakServiceToken__ClientSecret
    value: "$(KC_CLIENT_SECRET)"
  - name: KeycloakServiceToken__CacheKeyPrefix
    value: "inktavia:admin-panel-bff:keycloak-service-token"

  # ── CORS ─────────────────────────────────────────────────────────────────────
  # CORS ingress'te DEĞİL uygulamada: dört BFF de kodda CORS kuruyor, ingress'te de
  # yapsaydık çift Access-Control-Allow-Origin başlığı çıkar ve tarayıcı reddederdi.
  # 🔴 FAZ25 (2026-08-24): Cors__AllowedOrigins burada HİÇ YOKTU — Faz 20'de admin SPA'nın
  # dev host'u olmadığı için eklenmemişti. Faz 24'te dev-admin.inktavia.com doğunca SPA,
  # BFF'ine tarayıcıdan tek istek atamadı ("İstek işlenemedi" — preflight reddi). Provider
  # BFF'indeki kalıbın aynısı: __0 = gerçek dev host, __1 = geliştirici makinesi.
  - name: Cors__AllowedOrigins__0
    value: "https://dev-admin.inktavia.com"
  - name: Cors__AllowedOrigins__1
    value: "http://localhost:3000"
  # SignalR origin listesi de aynı sebeple dev host'u içermeli (canlı bildirimler websocket'le).
  - name: Realtime__SignalR__AllowedOrigins__0
    value: "https://dev-admin.inktavia.com"
  - name: Realtime__SignalR__AllowedOrigins__1
    value: "http://localhost:3000"

  # ── Modül çağrıları ──────────────────────────────────────────────────────────
  # Hepsi cluster içi ClusterIP servisleri; port 80 → container 8080.
  - name: RemoteCalls__IAdminCargoDryBffRemoteCall__BaseUrl
    value: "http://aizen-cargodry"
  - name: RemoteCalls__IAdminMessagingBffRemoteCall__BaseUrl
    value: "http://aizen-messaging"
  - name: RemoteCalls__IAdminPaymentBffRemoteCall__BaseUrl
    value: "http://aizen-payment"
  # FAZ9: DI (DependencyInjection.cs:112) "IAdminProfilePerformanceBffRemoteCall" arıyordu ama bu anahtar
  # hiçbir yerde tanımlı değildi → 11 performans handler'ı BaseAddress'siz kalıyordu. Hedef: Profile modülü.
  - name: RemoteCalls__IAdminProfilePerformanceBffRemoteCall__BaseUrl
    value: "http://aizen-profile"
  - name: RemoteCalls__IFileStorageAdminBffRemoteCall__BaseUrl
    value: "http://aizen-filestorage"
  - name: RemoteCalls__IIdentityAdminBffRemoteCall__BaseUrl
    value: "http://aizen-identity"
  # FAZ9: DI (DependencyInjection.cs:103) bu anahtarı "IAdminNotificationBffRemoteCall" olarak arıyor;
  # buradaki isim sırası yanlıştı (Admin ortada) → INotificationTemplateRemoteCall BaseAddress'siz kalıyordu.
  - name: RemoteCalls__IAdminNotificationBffRemoteCall__BaseUrl
    value: "http://aizen-notification"
  - name: RemoteCalls__INotificationBffRemoteCall__BaseUrl
    value: "http://aizen-notification"
  - name: RemoteCalls__IReferenceDataAdminBffRemoteCall__BaseUrl
    value: "http://aizen-referencedata"
  - name: RemoteCalls__IServiceRequestAdminBffRemoteCall__BaseUrl
    value: "http://aizen-servicerequest"
  - name: RemoteCalls__IVesselAdminBffRemoteCall__BaseUrl
    value: "http://aizen-vessel"
