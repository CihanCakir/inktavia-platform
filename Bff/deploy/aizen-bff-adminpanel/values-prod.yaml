# aizen-bff-adminpanel — üretim değerleri (inktavia-prod)
#
# ⚠️ BU DOSYA PUBLIC BİR REPODA. Sırlar Sealed Secret'tan env olarak geliyor.
#    $(VAR) genişletmesi YALNIZ listede daha önce tanımlanmış değişkenler için çalışır.
#
# BFF'lerin modüllerden iki farkı var:
#   1. INGRESS AÇIK — internete bakan tek katman bunlar. Modüllerde kapalı olması bir
#      güvenlik şartıydı (bkz. Modules/*/values-prod.yaml).
#   2. PostgreSQL YOK — yalnız Redis + RabbitMQ. Bağlantı havuzu hesabına girmiyorlar.

# SignalR/WebSocket: ingress-nginx bağlantıyı 60 sn'de kapatmasın diye timeout 3600'e
# çekildi. Aksi hâlde canlı mesajlaşma dakikada bir sessizce kopar ve istemci reconnect eder.
#
# Deploy:
#   helm upgrade --install aizen-bff-adminpanel . -n inktavia-prod -f values-prod.yaml \
#     --set image.tag=sha-$(git rev-parse --short=7 origin/develop)

replicaCount: 1

image:
  repository: ghcr.io/cihancakir/inktavia/bff-adminpanel
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: admin-api.inktavia.com
      paths:
        - path: /
          pathType: Prefix
  # TLS Cloudflare Tunnel'da sonlanacak (Faz 9); origin sertifikası gerekmiyor.
  tls: []

probes:
  path: /info
  startup:
    periodSeconds: 5
    failureThreshold: 24   # 2 dakika — BFF'lerde migration yok, modüllerden hızlı açılır

# BFF'ler modüllerden hafif: EF/migration yok, iş mantığı modüllerde.
resources:
  requests:
    cpu: 25m
    memory: 120Mi
  limits:
    cpu: 400m
    memory: 320Mi

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

env:
  # ── Sırlar ───────────────────────────────────────────────────────────────────
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: REDIS_PASSWORD }
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: RABBITMQ_PASSWORD }
  - name: KC_CLIENT_SECRET
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: KEYCLOAK_ADMIN_PANEL_BFF_CLIENT_SECRET }
  - name: BffAssertion__SharedSecret
    valueFrom:
      secretKeyRef: { name: bff-assertion, key: SharedSecret }

  # ── BFF assertion izin listesi ───────────────────────────────────────────────
  # Paylaşılan sır TEK BAŞINA yetmez ve kod bunu fail-closed reddediyor:
  #   "SharedSecret is configured but AllowedClientIds is empty. An empty allowlist
  #    would let ANY caller holding a valid service-account token assert ANY user id."
  # Doğru davranış — bu liste, sırrı bilen bir çağıranın hangi client kimliğiyle
  # gelebileceğini sınırlar. Sır sızsa bile listede olmayan bir client geçemez.
  - name: BffAssertion__AllowedClientIds__0
    value: "admin-panel-bff"
  - name: BffAssertion__AllowedClientIds__1
    value: "provider-portal-bff"
  - name: BffAssertion__AllowedClientIds__2
    value: "marine-web-bff"
  - name: BffAssertion__AllowedClientIds__3
    value: "marine-mobile-bff"

  # ── Elastic APM ──────────────────────────────────────────────────────────────
  # appsettings'te ServerUrl "__FROM_ENV__" yer tutucusuyla duruyor; ajan bunu URL
  # sanıp ayrıştırmada patlıyor ve saniyede bir 127.0.0.1:8200'e bağlanmaya çalışıyor.
  # Gözlemlenebilirlik yığını Faz 11'in işi; o zamana kadar kapalı.
  - name: ElasticApm__Enabled
    value: "false"
  - name: ElasticApm__ServerUrl
    value: ""

  # ── Çalışma ortamı ───────────────────────────────────────────────────────────
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: TZ
    value: Europe/Istanbul

  # ── Önbellek ve mesaj kuyruğu ────────────────────────────────────────────────
  - name: DistributedCache__InstanceName
    value: "AdminPanelBff:"
  - name: DistributedCache__Configuration
    value: "redis:6379,password=$(REDIS_PASSWORD),abortConnect=False,defaultDatabase=13"
  - name: MessageBroker__QueueSettings__HostName
    value: "rabbitmq"
  - name: MessageBroker__QueueSettings__Port
    value: "5672"
  - name: MessageBroker__QueueSettings__VirtualHost
    value: "/"
  - name: MessageBroker__QueueSettings__UserName
    value: "aizen"
  - name: MessageBroker__QueueSettings__Password
    value: "$(RABBITMQ_PASSWORD)"

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  # ⚠️ Authority = token'daki issuer. Core/Auth/BuilderExtensions.cs içinde
  # ValidIssuer DOĞRUDAN bu değere eşitleniyor, metadata'dan türetilmiyor.
  # Keycloak issuer'ı 2026-08-18'de https://auth.inktavia.com'a sabitlendi.
  # MetadataAddress ve TokenEndpoint BİLEREK iç adreste kaldı: discovery ve JWKS
  # cluster içinden çekiliyor, token doğrulaması Cloudflare'e bağımlı değil.
  - name: AdminPanelKeycloak__BaseUrl
    value: "http://keycloak:8080"
  - name: AdminPanelKeycloak__Authority
    value: "https://auth.inktavia.com/realms/inktavia-realm"
  - name: AdminPanelKeycloak__MetadataAddress
    value: "http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration"
  - name: AdminPanelKeycloak__Realm
    value: "inktavia-realm"
  - name: AdminPanelKeycloak__Audience
    value: "admin-panel-bff"
  - name: AdminPanelKeycloak__RequireHttpsMetadata
    value: "false"
  - name: AdminPanelKeycloak__AdminClientSecret
    value: "$(KC_CLIENT_SECRET)"

  # ── Keycloak servis token'ı ──────────────────────────────────────────────────
  - name: KeycloakServiceToken__Authority
    value: "https://auth.inktavia.com/realms/inktavia-realm"
  - name: KeycloakServiceToken__TokenEndpoint
    value: "http://keycloak:8080/realms/inktavia-realm/protocol/openid-connect/token"
  - name: KeycloakServiceToken__ClientId
    value: "admin-panel-bff"
  - name: KeycloakServiceToken__ClientSecret
    value: "$(KC_CLIENT_SECRET)"
  - name: KeycloakServiceToken__CacheKeyPrefix
    value: "inktavia:admin-panel-bff:keycloak-service-token"

  # ── CORS ─────────────────────────────────────────────────────────────────────
  # CORS ingress'te DEĞİL uygulamada: dört BFF de kodda CORS kuruyor, ingress'te de
  # yapsaydık çift Access-Control-Allow-Origin başlığı çıkar ve tarayıcı reddederdi.
  - name: Realtime__SignalR__AllowedOrigins__0
    value: "https://admin.inktavia.com"

  # ── Modül çağrıları ──────────────────────────────────────────────────────────
  # Hepsi cluster içi ClusterIP servisleri; port 80 → container 8080.
  - name: RemoteCalls__IAdminCargoDryBffRemoteCall__BaseUrl
    value: "http://aizen-cargodry"
  - name: RemoteCalls__IAdminMessagingBffRemoteCall__BaseUrl
    value: "http://aizen-messaging"
  - name: RemoteCalls__IAdminPaymentBffRemoteCall__BaseUrl
    value: "http://aizen-payment"
  - name: RemoteCalls__IFileStorageAdminBffRemoteCall__BaseUrl
    value: "http://aizen-filestorage"
  - name: RemoteCalls__IIdentityAdminBffRemoteCall__BaseUrl
    value: "http://aizen-identity"
  - name: RemoteCalls__INotificationAdminBffRemoteCall__BaseUrl
    value: "http://aizen-notification"
  - name: RemoteCalls__INotificationBffRemoteCall__BaseUrl
    value: "http://aizen-notification"
  - name: RemoteCalls__IReferenceDataAdminBffRemoteCall__BaseUrl
    value: "http://aizen-referencedata"
  - name: RemoteCalls__IServiceRequestAdminBffRemoteCall__BaseUrl
    value: "http://aizen-servicerequest"
  - name: RemoteCalls__IVesselAdminBffRemoteCall__BaseUrl
    value: "http://aizen-vessel"
