# aizen-bff-marine-web — dev değerleri (inktavia-dev)
#
# ⚠️ BU DOSYA PUBLIC BİR REPODA. Sırlar Sealed Secret'tan env olarak geliyor.
#    $(VAR) genişletmesi YALNIZ listede daha önce tanımlanmış değişkenler için çalışır.
#
# ⚠️ DEV ORTAMI. BFF'lerde PostgreSQL/Mongo yok; ayrım Redis ve RabbitMQ'da:
#   Redis    : defaultDatabase=14 (prod 13)
#   RabbitMQ : vhost /dev
#
# ASPNETCORE_ENVIRONMENT=Production BİLEREK: bu ortamın işi geliştirme değil, prod'a
# çıkmadan önce PROD DAVRANIŞINI sınamak. Development modunda BffAssertion fail-closed
# kontrolü devre dışı kalır — dev yeşil yanar, prod patlar.
#
# INGRESS KAPALI: dev BFF'leri internete açılmıyor. Erişim:
#   kubectl -n inktavia-dev port-forward deploy/aizen-bff-marine-web 8080:8080
#

# ⚠️ replicaCount'u BURADAN yönetme. Ortamın açık/kapalı olması
# gitops/apps/{prod,dev}-appset.yaml içindeki `replicaCount` parametresinden
# geliyor ve Helm parametresi bu değerin ÜZERİNE yazıyor. Buradaki 1, chart tek
# başına çalıştırıldığında geçerli olan doğal varsayılan.
# Ortam değiştirmek için:  python3 scripts/ortam-degistir.py dev|prod
replicaCount: 1

image:
  repository: ghcr.io/cihancakir/inktavia/bff-marine-web
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  # AÇIK — dev ana ortam olduğu için Cloudflare Tunnel üzerinden erişilebilir.
  # Host'lar dev-* ön ekli; prod host'larıyla asla karışmasın.
  # ⚠️ Yeni bir dev host'u eklersen Cloudflare'de İKİ yer güncellenmeli:
  #    1. Tünel yönlendirmesi (Published application routes)
  #    2. /info için Access uygulaması — yoksa o host'un /info'su açıkta kalır
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
  hosts:
    - host: dev-web-api.inktavia.com
      paths:
        - path: /
          pathType: Prefix
  # TLS Cloudflare Tunnel'da sonlanacak (Faz 9); origin sertifikası gerekmiyor.
  tls: []

probes:
  path: /info
  startup:
    periodSeconds: 5
    failureThreshold: 24   # 2 dakika — BFF'lerde migration yok, modüllerden hızlı açılır

# BFF'ler modüllerden hafif: EF/migration yok, iş mantığı modüllerde.
resources:
  requests:
    cpu: 15m
    memory: 90Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

env:
  # ── Sırlar ───────────────────────────────────────────────────────────────────
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: REDIS_PASSWORD }
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: RABBITMQ_PASSWORD }
  - name: KC_CLIENT_SECRET
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: KEYCLOAK_MARINE_WEB_BFF_CLIENT_SECRET }
  - name: BffAssertion__SharedSecret
    valueFrom:
      secretKeyRef: { name: bff-assertion, key: SharedSecret }
  - name: WEB_TRUSTED_CALLER_SECRET
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: MARINE_WEB_TRUSTED_CALLER_SECRET }
  - name: WEB_REVALIDATE_SECRET
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: MARINE_WEB_REVALIDATE_SECRET }

  # ── BFF assertion izin listesi ───────────────────────────────────────────────
  # Paylaşılan sır TEK BAŞINA yetmez ve kod bunu fail-closed reddediyor:
  #   "SharedSecret is configured but AllowedClientIds is empty. An empty allowlist
  #    would let ANY caller holding a valid service-account token assert ANY user id."
  # Doğru davranış — bu liste, sırrı bilen bir çağıranın hangi client kimliğiyle
  # gelebileceğini sınırlar. Sır sızsa bile listede olmayan bir client geçemez.
  - name: BffAssertion__AllowedClientIds__0
    value: "admin-panel-bff"
  - name: BffAssertion__AllowedClientIds__1
    value: "provider-portal-bff"
  - name: BffAssertion__AllowedClientIds__2
    value: "marine-web-bff"
  - name: BffAssertion__AllowedClientIds__3
    value: "marine-mobile-bff"

  # ── Elastic APM ──────────────────────────────────────────────────────────────
  # appsettings'te ServerUrl "__FROM_ENV__" yer tutucusuyla duruyor; ajan bunu URL
  # sanıp ayrıştırmada patlıyor ve saniyede bir 127.0.0.1:8200'e bağlanmaya çalışıyor.
  # Gözlemlenebilirlik yığını Faz 11'in işi; o zamana kadar kapalı.
  - name: ElasticApm__Enabled
    value: "false"
  - name: ElasticApm__ServerUrl
    value: ""

  # ── Çalışma ortamı ───────────────────────────────────────────────────────────
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: TZ
    value: Europe/Istanbul

  # ── Önbellek ve mesaj kuyruğu ────────────────────────────────────────────────
  - name: DistributedCache__InstanceName
    value: "MarineWebBff:"
  # ⚠️ defaultDatabase prod=13 / dev=14. Bu numara SERVİSLERİ ayırmaz — onu
  # DistributedCache__InstanceName yapar (her BFF kendi ön ekini kullanır).
  # Numaranın tek işlevi prod/dev ayrımı. Servis başına ayrı numara vermeye
  # kalkma: Redis varsayılanda 16 veritabanı tutar (indis 0-15) ve 16/17 gibi
  # değerler "ERR DB index is out of range" ile ilk önbellek işleminde patlar.
  - name: DistributedCache__Configuration
    value: "redis:6379,password=$(REDIS_PASSWORD),abortConnect=False,defaultDatabase=14"
  - name: MessageBroker__QueueSettings__HostName
    value: "rabbitmq"
  - name: MessageBroker__QueueSettings__Port
    value: "5672"
  - name: MessageBroker__QueueSettings__VirtualHost
    value: "/dev"
  - name: MessageBroker__QueueSettings__UserName
    value: "aizen"
  - name: MessageBroker__QueueSettings__Password
    value: "$(RABBITMQ_PASSWORD)"

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  # ⚠️ Authority = token'daki issuer. Core/Auth/BuilderExtensions.cs içinde
  # ValidIssuer DOĞRUDAN bu değere eşitleniyor, metadata'dan türetilmiyor.
  # Keycloak issuer'ı 2026-08-18'de https://auth.inktavia.com'a sabitlendi.
  # MetadataAddress ve TokenEndpoint BİLEREK iç adreste kaldı: discovery ve JWKS
  # cluster içinden çekiliyor, token doğrulaması Cloudflare'e bağımlı değil.
  - name: MarineWebKeycloak__BaseUrl
    value: "http://keycloak:8080"
  - name: MarineWebKeycloak__Authority
    value: "https://auth.inktavia.com/realms/inktavia-realm"
  - name: MarineWebKeycloak__MetadataAddress
    value: "http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration"
  - name: MarineWebKeycloak__Realm
    value: "inktavia-realm"
  - name: MarineWebKeycloak__Audience
    value: "marine-web-bff"
  - name: MarineWebKeycloak__RequireHttpsMetadata
    value: "false"
  - name: MarineWebKeycloak__AdminClientSecret
    value: "$(KC_CLIENT_SECRET)"
  # ── BFF kimlik iddiası anahtarı (FAZ10 #31) ──────────────────────────────────
  # DelegatingHandler bu değer BOŞKEN X-Aizen-Bff-Assertion + X-Aizen-User-Id başlıklarını GÖNDERMİYORDU;
  # modüller ise aynı mühürlü secret'ı BffAssertion__SharedSecret olarak doğruluyor (prod'da boşsa açılmıyor).
  # HMAC (FixedTimeEquals) tutması için modülün SharedSecret'i ile AYNI secret'a bağlanır. Asserted user-id
  # modül tarafında UserInfo.UserId'yi doldurur (audit/CreateUserId); endpoint'ler servis token'ıyla zaten
  # çalışıyor, bu EK güvence.  (appsettings.json'daki "__FROM_SECRET__" yer tutucusu "" ile değiştirildi.)
  - name: MarineWebKeycloak__ModuleAssertionSecret
    valueFrom:
      secretKeyRef: { name: bff-assertion, key: SharedSecret }

  # ── CORS ─────────────────────────────────────────────────────────────────────
  # CORS ingress'te DEĞİL uygulamada: dört BFF de kodda CORS kuruyor, ingress'te de
  # yapsaydık çift Access-Control-Allow-Origin başlığı çıkar ve tarayıcı reddederdi.
  - name: Cors__AllowedOrigins__0
    value: "http://localhost:3000"
  - name: Cors__AllowedOrigins__1
    value: "http://127.0.0.1:3000"

  # ── Marine Web public yüzey ──────────────────────────────────────────────────
  - name: MarineWebPublic__TrustedCallerSecret
    value: "$(WEB_TRUSTED_CALLER_SECRET)"
  - name: MarineWebPublic__Revalidate__Secret
    value: "$(WEB_REVALIDATE_SECRET)"
  # Revalidate URL Next.js sitesine gidiyor; Faz 10'da frontend yayına alınınca dolacak.
  # - name: MarineWebPublic__Revalidate__Url
  #   value: "https://inktavia.com/api/revalidate"

  # ── Modül çağrıları ──────────────────────────────────────────────────────────
  # Hepsi cluster içi ClusterIP servisleri; port 80 → container 8080.
  - name: RemoteCalls__IContentRemoteCall__BaseUrl
    value: "http://aizen-content"
  - name: RemoteCalls__IIdentityRemoteCall__BaseUrl
    value: "http://aizen-identity"
  - name: RemoteCalls__INotificationRemoteCall__BaseUrl
    value: "http://aizen-notification"
  - name: RemoteCalls__IPaymentRemoteCall__BaseUrl
    value: "http://aizen-payment"
  - name: RemoteCalls__IReferenceDataRemoteCall__BaseUrl
    value: "http://aizen-referencedata"
