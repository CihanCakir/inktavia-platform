# Default values for aizen-filestorage.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nexus.local:8083/aizen/filestorage
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  # SECURITY: modules must NEVER be reachable from outside the cluster.
  # A module trusts the identity the BFF asserts (X-Aizen-User-Id + a shared
  # secret). Anyone who can reach a module and holds that secret can
  # impersonate ANY user by changing the header. Two things prevent it:
  # this flag, and infrastructure/k8s/networkpolicy-internal-modules.yaml.
  # See infrastructure/k8s/README.md.
  # Enforced in CI by scripts/ci/assert-no-module-ingress.sh
  enabled: false
  className: "nginx"
  annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: dev-aizen-filestorage.aizen.local
      paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: aizen-filestorage
                port:
                  number: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
- name: ASPNETCORE_ENVIRONMENT 
  value: dev      
- name: TZ
  value: Europe/Istanbul
- name: S3ObjectStorage__Provider
  value: "AWS"
- name: S3ObjectStorage__Region
  value: "eu-central-1"
- name: S3ObjectStorage__BucketName
  value: "inktavia-filestorage-dev"
- name: S3ObjectStorage__ForcePathStyle
  value: "false"
- name: S3ObjectStorage__UseHttp
  value: "false"
- name: S3ObjectStorage__UploadUrlExpirationMinutes
  value: "15"
- name: S3ObjectStorage__ReadUrlExpirationMinutes
  value: "60"
- name: S3ObjectStorage__AccessKey
  valueFrom:
    secretKeyRef:
      name: filestorage-s3-secret
      key: access-key
- name: S3ObjectStorage__SecretKey
  valueFrom:
    secretKeyRef:
      name: filestorage-s3-secret
      key: secret-key
