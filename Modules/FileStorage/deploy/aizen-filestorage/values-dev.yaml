# aizen-filestorage — dev değerleri (inktavia-dev)
#
# ⚠️ DEV ORTAMI — veri katmanı prod'dan TAMAMEN ayrı.
#
# Ayrım beş katmanda birden yapılır; birini atlamak dev'in prod verisine yazması demektir:
#   PostgreSQL : inktavia_store_dev
#   MongoDB    : her veritabanı adına _dev soneki
#   Redis      : defaultDatabase=14 (prod 13)
#   RabbitMQ   : vhost /dev
#   MinIO      : inktavia-filestorage-dev
#
# ASPNETCORE_ENVIRONMENT=Production BİLEREK: bu ortamın işi geliştirme değil, prod'a
# çıkmadan önce PROD DAVRANIŞINI sınamak. Development modunda BffAssertion fail-closed
# kontrolü devre dışı kalır, log seviyesi ve seed davranışı değişir — dev yeşil yanar,
# prod patlar.
#
# replicaCount: 0 — dev kotası 2Gi / 8 pod, 11 modül aynı anda sığmaz.
# Test edeceğin modülü kaldır:
#   kubectl -n inktavia-dev scale deploy/aizen-<modul> --replicas=1
# İşin bitince geri indir; boşta duran pod kotayı ve belleği yer.
#
# ⚠️ BU DOSYA PUBLIC BİR REPODA. Hiçbir sır burada düz metin duramaz.
#    Parolalar `platform-credentials` Sealed Secret'ından geliyor; connection string'lerin
#    okunabilir kısmı burada, parola kısmı Kubernetes'in $(VAR) genişletmesiyle doluyor.
#    $(VAR) YALNIZCA listede DAHA ÖNCE tanımlanmış değişkenler için çalışır — bu yüzden
#    secretKeyRef girdileri en üstte.
#
# Deploy:
#   helm upgrade --install aizen-filestorage . -n inktavia-dev -f values-dev.yaml \
#     --set image.tag=sha-$(git rev-parse --short=7 origin/develop)
# Geri alma:
#   helm rollback aizen-filestorage -n inktavia-dev

replicaCount: 0

image:
  repository: ghcr.io/cihancakir/inktavia/filestorage
  # sha- etiketi değişmez olduğu için IfNotPresent doğru: node yeniden başladığında
  # GHCR'a gitmeye gerek kalmaz, internet kesikse bile pod ayağa kalkar.
  pullPolicy: IfNotPresent
  tag: ""          # ZORUNLU — deploy sırasında --set ile verilir

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  # SECURITY: modules must NEVER be reachable from outside the cluster.
  # A module trusts the identity the BFF asserts (X-Aizen-User-Id + a shared
  # secret). Anyone who can reach a module and holds that secret can
  # impersonate ANY user by changing the header. Two things prevent it:
  # this flag, and infrastructure/k8s/networkpolicy-internal-modules.yaml.
  # See infrastructure/k8s/README.md.
  # Enforced in CI by scripts/ci/assert-no-module-ingress.sh
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []

probes:
  path: /info
  startup:
    periodSeconds: 5
    failureThreshold: 60   # 5 dakika — açılışta EF migration çalışıyor

# Ölçüldü (2026-08-17, boşta): modüller 114–258Mi, Payment en yüksek (Hangfire).
# İstek = zamanlayıcının REZERVE ettiği miktar → gerçek kullanıma yakın olmalı.
# Tavan = GC tepe noktası için pay → boştakinin ~3 katı.
resources:
  requests:
    cpu: 25m
    memory: 120Mi
  limits:
    cpu: 300m
    memory: 300Mi

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

env:
  # ── Sırlar — önce tanımlanmalı ki aşağıdaki $(VAR) genişletmesi çalışsın ──────
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: POSTGRES_PASSWORD }
  - name: MONGO_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: MONGO_PASSWORD }
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: REDIS_PASSWORD }
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: RABBITMQ_PASSWORD }
  - name: MINIO_ACCESS_KEY
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: MINIO_ACCESS_KEY }
  - name: MINIO_SECRET_KEY
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: MINIO_SECRET_KEY }

  # ── Elastic APM ──────────────────────────────────────────────────────────────
  # appsettings'te ServerUrl "__FROM_ENV__" yer tutucusuyla duruyor; ajan bunu URL
  # sanıp ayrıştırmada patlıyor ve saniyede bir 127.0.0.1:8200'e bağlanmaya çalışıyor.
  # Ölçüldü (2026-08-18): modül başına 5 dakikada 20-60 satır log.
  # Gözlemlenebilirlik yığını Faz 11'in işi; o zamana kadar kapalı.
  # ⚠️ İkisi birden gerekli — yalnız Enabled=false verilirse ajan yine de
  #    ServerUrl'i ayrıştırmaya çalışır.
  - name: ElasticApm__Enabled
    value: "false"
  - name: ElasticApm__ServerUrl
    value: ""

  # ── Çalışma ortamı ───────────────────────────────────────────────────────────
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: TZ
    value: Europe/Istanbul

  # ── Veri katmanı ─────────────────────────────────────────────────────────────
  # Tek veritabanı (inktavia_store), modül başına ayrı PostgreSQL şeması.
  # Maximum Pool Size=5 KRİTİK: max_connections=200 ve 15 servis var (15×12=180).
  # appsettings'teki 300 değeri 15 modülde 4500 bağlantı demekti.
  - name: DatabaseSettings__FileStorage__Type
    value: "PostgreSQL"
  - name: DatabaseSettings__FileStorage__ConnectionString
    value: "Host=postgres;Port=5432;Database=inktavia_store_dev;Username=aizen;Password=$(POSTGRES_PASSWORD);Maximum Pool Size=5"
  - name: DatabaseSettings__FileStorageMongo__Type
    value: "Mongo"
  - name: DatabaseSettings__FileStorageMongo__ConnectionString
    value: "mongodb://aizen:$(MONGO_PASSWORD)@mongo:27017/FileStorage_dev?authSource=admin"
  - name: DistributedCache__InstanceName
    value: "FileStorage:"
  # Tüm modüller Redis db 13'ü paylaşıyor; anahtarlar InstanceName ile ayrışıyor.
  - name: DistributedCache__Configuration
    value: "redis:6379,password=$(REDIS_PASSWORD),abortConnect=False,defaultDatabase=14"

  - name: MessageBroker__QueueSettings__HostName
    value: "rabbitmq"
  - name: MessageBroker__QueueSettings__Port
    value: "5672"
  - name: MessageBroker__QueueSettings__VirtualHost
    value: "/dev"
  - name: MessageBroker__QueueSettings__UserName
    value: "aizen"
  - name: MessageBroker__QueueSettings__Password
    value: "$(RABBITMQ_PASSWORD)"

  # ── BFF assertion — bu olmadan modül AÇILMAZ ─────────────────────────────────
  # Core/InfoAccessor, Development dışında boş SharedSecret ile başlatmayı
  # fail-closed olarak reddediyor: modülün tek kimlik güvencesi bu sır.
  - name: BffAssertion__SharedSecret
    valueFrom:
      secretKeyRef: { name: bff-assertion, key: SharedSecret }
  - name: BffAssertion__AllowedClientIds__0
    value: "admin-panel-bff"
  - name: BffAssertion__AllowedClientIds__1
    value: "provider-portal-bff"
  - name: BffAssertion__AllowedClientIds__2
    value: "marine-web-bff"
  - name: BffAssertion__AllowedClientIds__3
    value: "marine-mobile-bff"

  # ── Seed/mock kapatma — AÇIKÇA ───────────────────────────────────────────────
  # Çoğu modülün appsettings.Production.json'ı bunları zaten kapatıyor, ama
  # CargoDry'nin Production dosyası HİÇ YOK ve base'e düşüyor. Sessiz varsayılana
  # güvenmek yerine hepsinde açıkça kapatıyoruz — üretime mock veri sızması
  # geri alınması zor bir hatadır.
  - name: MockData__Enabled
    value: "false"
  - name: MockData__RunOnStartup
    value: "false"
  - name: ReferenceDataSeed__Enabled
    value: "false"
  - name: CargoDrySeed__Enabled
    value: "false"
  - name: MessagingSeed__Enabled
    value: "false"
  - name: NotificationSeed__Enabled
    value: "false"
  - name: PaymentSeed__Enabled
    value: "false"

  # ── Nesne deposu (MinIO) ─────────────────────────────────────────────────────
  # ServiceUrl cluster içi, PublicServiceUrl tarayıcıya gidiyor: presigned URL'ler
  # SigV4 ile Host başlığını imzalar, o yüzden istemcinin gerçekten çağıracağı adrese
  # imzalanmalı. Faz 9'da files.inktavia.com'a çevrilecek; şimdilik LAN adresi.
  - name: S3ObjectStorage__Provider
    value: "MinIO"
  - name: S3ObjectStorage__AccessKey
    value: "$(MINIO_ACCESS_KEY)"
  - name: S3ObjectStorage__SecretKey
    value: "$(MINIO_SECRET_KEY)"
  - name: S3ObjectStorage__Region
    value: "us-east-1"
  - name: S3ObjectStorage__BucketName
    value: "inktavia-filestorage-dev"
  - name: S3ObjectStorage__ServiceUrl
    value: "http://minio:9000"
  - name: S3ObjectStorage__PublicServiceUrl
    value: "http://192.168.1.50:9000"
  - name: S3ObjectStorage__ForcePathStyle
    value: "true"
  - name: S3ObjectStorage__UseHttp
    value: "true"
