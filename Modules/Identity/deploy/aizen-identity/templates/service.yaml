apiVersion: v1
kind: Service
metadata:
  name: {{ include "aizen-identity.fullname" . }}
  labels:
    {{- include "aizen-identity.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  # #92: Keycloak (docker, cluster DISI) SPI consume cagrisi bu IP'ye gider — sabit kalmali.
  clusterIP: {{ . }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aizen-identity.selectorLabels" . | nindent 4 }}
