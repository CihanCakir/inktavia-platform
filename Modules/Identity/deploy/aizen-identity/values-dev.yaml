# aizen-identity — dev değerleri (inktavia-dev)
#
# ⚠️ DEV ORTAMI — veri katmanı prod'dan TAMAMEN ayrı.
#
# Ayrım beş katmanda birden yapılır; birini atlamak dev'in prod verisine yazması demektir:
#   PostgreSQL : inktavia_store_dev
#   MongoDB    : her veritabanı adına _dev soneki
#   Redis      : defaultDatabase=14 (prod 13)
#   RabbitMQ   : vhost /dev
#   MinIO      : inktavia-filestorage-dev
#
# ASPNETCORE_ENVIRONMENT=Production BİLEREK: bu ortamın işi geliştirme değil, prod'a
# çıkmadan önce PROD DAVRANIŞINI sınamak. Development modunda BffAssertion fail-closed
# kontrolü devre dışı kalır, log seviyesi ve seed davranışı değişir — dev yeşil yanar,
# prod patlar.
#

# ⚠️ replicaCount'u BURADAN yönetme. Ortamın açık/kapalı olması
# gitops/apps/{prod,dev}-appset.yaml içindeki `replicaCount` parametresinden
# geliyor ve Helm parametresi bu değerin ÜZERİNE yazıyor. Buradaki 1, chart tek
# başına çalıştırıldığında geçerli olan doğal varsayılan.
# Ortam değiştirmek için:  python3 scripts/ortam-degistir.py dev|prod
replicaCount: 1

image:
  repository: ghcr.io/cihancakir/inktavia/identity
  # sha- etiketi değişmez olduğu için IfNotPresent doğru seçim: node yeniden başladığında
  # GHCR'a gitmeye gerek kalmaz, internet kesikse bile pod ayağa kalkar.
  pullPolicy: IfNotPresent
  tag: ""          # ZORUNLU — deploy sırasında --set ile verilir, boş bırakılırsa helm patlar

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80          # cluster içi çağrılar http://aizen-identity ile gelsin
  targetPort: 8080  # .NET 9 varsayılanı

ingress:
  # SECURITY: modules must NEVER be reachable from outside the cluster.
  # A module trusts the identity the BFF asserts (X-Aizen-User-Id + a shared
  # secret). Anyone who can reach a module and holds that secret can
  # impersonate ANY user by changing the header. Two things prevent it:
  # this flag, and infrastructure/k8s/networkpolicy-internal-modules.yaml.
  # See infrastructure/k8s/README.md.
  # Enforced in CI by scripts/ci/assert-no-module-ingress.sh
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []

probes:
  path: /info
  startup:
    periodSeconds: 5
    # 60 × 5sn = 5 dakika. Açılışta EF migration çalışıyor ve boş veritabanında
    # şemayı sıfırdan kuruyor; cömert olmak gerekiyor. Startup geçtikten sonra
    # liveness normal sıkılığına dönüyor.
    failureThreshold: 60

# §1.5 bellek bütçesi: prod kotası 7Gi, 15 servis → servis başına ~450Mi tavan.
# İmajda DOTNET_gcServer=0 zaten ayarlı (Server GC çekirdek başına heap ayırıyordu).
# Ölçüldü (2026-08-17, boşta): modüller 114–258Mi, Payment en yüksek (Hangfire).
# İstek = zamanlayıcının REZERVE ettiği miktar → gerçek kullanıma yakın olmalı.
# Tavan = GC tepe noktası için pay → boştakinin ~3 katı.
resources:
  requests:
    cpu: 25m
    memory: 120Mi
  limits:
    cpu: 300m
    memory: 300Mi

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

env:
  # ── Sırlar — önce tanımlanmalı ki aşağıdaki $(VAR) genişletmesi çalışsın ──────
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: POSTGRES_PASSWORD }
  - name: MONGO_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: MONGO_PASSWORD }
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: REDIS_PASSWORD }
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: RABBITMQ_PASSWORD }
  - name: KEYCLOAK_ADMIN_CLIENT_SECRET
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: KEYCLOAK_PROVIDER_BFF_CLIENT_SECRET }
  - name: TOKEN_SECURITY_KEY
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: TOKEN_SECURITY_KEY }
  - name: OTP_TICKET_SECRET
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: OTP_LOGIN_TICKET_SECRET }
  - name: OTP_CONSUME_SECRET
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: OTP_LOGIN_CONSUME_SECRET }

  # ── Elastic APM ──────────────────────────────────────────────────────────────
  # appsettings'te ServerUrl "__FROM_ENV__" yer tutucusuyla duruyor; ajan bunu URL
  # sanıp ayrıştırmada patlıyor ve saniyede bir 127.0.0.1:8200'e bağlanmaya çalışıyor.
  # Ölçüldü (2026-08-18): modül başına 5 dakikada 20-60 satır log.
  # Gözlemlenebilirlik yığını Faz 11'in işi; o zamana kadar kapalı.
  # ⚠️ İkisi birden gerekli — yalnız Enabled=false verilirse ajan yine de
  #    ServerUrl'i ayrıştırmaya çalışır.
  - name: ElasticApm__Enabled
    value: "false"
  - name: ElasticApm__ServerUrl
    value: ""

  # ── Çalışma ortamı ───────────────────────────────────────────────────────────
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: TZ
    value: Europe/Istanbul

  # ── Veri katmanı ─────────────────────────────────────────────────────────────
  # Host adları k3s'teki selector'sız Service'ler; hepsi 192.168.1.50'ye çıkıyor.
  # Maximum Pool Size=5 KRİTİK: PostgreSQL max_connections=200 ve 15 servis var.
  # appsettings'teki 300 değeri 15 modülde 4500 bağlantı demekti — ilk yükte tükenirdi.
  - name: DatabaseSettings__Identity__Type
    value: "PostgreSQL"
  - name: DatabaseSettings__Identity__ConnectionString
    value: "Host=postgres;Port=5432;Database=inktavia_store_dev;Username=aizen;Password=$(POSTGRES_PASSWORD);Maximum Pool Size=5"
  - name: DatabaseSettings__IdentityMongo__Type
    value: "Mongo"
  - name: DatabaseSettings__IdentityMongo__ConnectionString
    value: "mongodb://aizen:$(MONGO_PASSWORD)@mongo:27017/Identity_dev?authSource=admin"
  - name: DistributedCache__InstanceName
    value: "Identity:"
  - name: DistributedCache__Configuration
    value: "redis:6379,password=$(REDIS_PASSWORD),abortConnect=False,defaultDatabase=14"

  - name: MessageBroker__QueueSettings__HostName
    value: "rabbitmq"
  - name: MessageBroker__QueueSettings__Port
    value: "5672"
  - name: MessageBroker__QueueSettings__VirtualHost
    value: "/dev"
  - name: MessageBroker__QueueSettings__UserName
    value: "aizen"
  - name: MessageBroker__QueueSettings__Password
    value: "$(RABBITMQ_PASSWORD)"

  # ── BFF assertion — bu olmadan modül AÇILMAZ ─────────────────────────────────
  # Core/InfoAccessor: Development dışında boş SharedSecret başlatmayı fail-closed
  # olarak durduruyor. Doğru davranış: bu sır modülün tek kimlik güvencesi.
  - name: BffAssertion__SharedSecret
    valueFrom:
      secretKeyRef: { name: bff-assertion, key: SharedSecret }
  - name: BffAssertion__AllowedClientIds__0
    value: "admin-panel-bff"
  - name: BffAssertion__AllowedClientIds__1
    value: "provider-portal-bff"
  - name: BffAssertion__AllowedClientIds__2
    value: "marine-web-bff"
  - name: BffAssertion__AllowedClientIds__3
    value: "marine-mobile-bff"

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  - name: IdentityKeycloak__Enabled
    value: "true"
  - name: IdentityKeycloak__BaseUrl
    value: "http://keycloak:8080"
  - name: IdentityKeycloak__Realm
    value: "inktavia-realm"
  - name: IdentityKeycloak__AdminClientId
    value: "provider-portal-bff"
  - name: IdentityKeycloak__AdminClientSecret
    value: "$(KEYCLOAK_ADMIN_CLIENT_SECRET)"

  # ── Token imzalama ───────────────────────────────────────────────────────────
  # appsettings'te "mysecuritykey" tekrarından ibaret bir sabit duruyor ve PUBLIC repoda.
  # Gerçek anahtar .env'de üretildi ve mühürlendi; buradan eziliyor.
  - name: TokenOption__SecurityKey
    value: "$(TOKEN_SECURITY_KEY)"

  # ── OTP → Keycloak devri ─────────────────────────────────────────────────────
  # Bu iki değer Keycloak'taki özel SPI ile BİREBİR aynı olmak zorunda; uyuşmazsa
  # OTP → login-ticket devri SESSİZCE başarısız olur (hata vermez, sadece çalışmaz).
  # İkisi de aynı .env'den mühürlendiği için kaynakta tektirler.
  - name: OtpLoginTicket__Secret
    value: "$(OTP_TICKET_SECRET)"
  - name: OtpLoginTicket__ConsumeSecret
    value: "$(OTP_CONSUME_SECRET)"
  # KeycloakAuthorizeBaseUrl tarayıcıya gidiyor, yani cluster içi adres olamaz.
  # Faz 9'da tünel kurulup auth.inktavia.com ayağa kalkınca doldurulacak.
  # - name: OtpLoginTicket__KeycloakAuthorizeBaseUrl
  #   value: "https://auth.inktavia.com/realms/inktavia-realm/protocol/openid-connect/auth"

  # ── Modüller arası çağrı ─────────────────────────────────────────────────────
  - name: RemoteCalls__IIdentityFileStorageRemoteCall__BaseUrl
    value: "http://aizen-filestorage"
