apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aizen-profile.fullname" . }}
  labels:
    {{- include "aizen-profile.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aizen-profile.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "aizen-profile.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aizen-profile.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env:
          {{- toYaml .Values.env | nindent 10 }}                
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # image.tag ZORUNLU. Chart.AppVersion'a düşmesine izin vermiyoruz: sessizce
          # var olmayan bir sürümü deneyip ImagePullBackOff'a düşmek yerine, helm
          # render aşamasında yüksek sesle patlasın.
          image: "{{ .Values.image.repository }}:{{ required "image.tag zorunlu — deploy sırasında --set image.tag=sha-<7hex> ver" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              # .NET 9 varsayılanı 8080. Chart'ta 80 yazıyordu ve hiç düzeltilmemişti;
              # bu hâliyle probe'lar ölü porta bakıyor, pod asla Ready olmuyordu.
              containerPort: {{ .Values.service.targetPort | default 8080 }}
              protocol: TCP
          # Açılışta EF migration çalışıyor (UseMigration = true). Boş bir veritabanında
          # bu dakikalar sürebilir; startupProbe olmadan liveness pod'u ölü sanıp öldürür
          # ve migration hiç tamamlanamaz — sonsuz restart döngüsü.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path | default "/info" }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold | default 60 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path | default "/info" }}
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path | default "/info" }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

