# aizen-servicerequest — üretim değerleri (inktavia-prod)
#
# ⚠️ BU DOSYA PUBLIC BİR REPODA. Hiçbir sır burada düz metin duramaz.
#    Parolalar `platform-credentials` Sealed Secret'ından geliyor; connection string'lerin
#    okunabilir kısmı burada, parola kısmı Kubernetes'in $(VAR) genişletmesiyle doluyor.
#    $(VAR) YALNIZCA listede DAHA ÖNCE tanımlanmış değişkenler için çalışır — bu yüzden
#    secretKeyRef girdileri en üstte.
#
# Deploy:
#   helm upgrade --install aizen-servicerequest . -n inktavia-prod -f values-prod.yaml \
#     --set image.tag=sha-$(git rev-parse --short=7 origin/develop)
# Geri alma:
#   helm rollback aizen-servicerequest -n inktavia-prod

replicaCount: 1

image:
  repository: ghcr.io/cihancakir/inktavia/servicerequest
  # sha- etiketi değişmez olduğu için IfNotPresent doğru: node yeniden başladığında
  # GHCR'a gitmeye gerek kalmaz, internet kesikse bile pod ayağa kalkar.
  pullPolicy: IfNotPresent
  tag: ""          # ZORUNLU — deploy sırasında --set ile verilir

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  # SECURITY: modules must NEVER be reachable from outside the cluster.
  # A module trusts the identity the BFF asserts (X-Aizen-User-Id + a shared
  # secret). Anyone who can reach a module and holds that secret can
  # impersonate ANY user by changing the header. Two things prevent it:
  # this flag, and infrastructure/k8s/networkpolicy-internal-modules.yaml.
  # See infrastructure/k8s/README.md.
  # Enforced in CI by scripts/ci/assert-no-module-ingress.sh
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []

probes:
  path: /info
  startup:
    periodSeconds: 5
    failureThreshold: 60   # 5 dakika — açılışta EF migration çalışıyor

resources:
  requests:
    cpu: 50m
    memory: 220Mi
  limits:
    cpu: 500m
    memory: 420Mi

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

env:
  # ── Sırlar — önce tanımlanmalı ki aşağıdaki $(VAR) genişletmesi çalışsın ──────
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: POSTGRES_PASSWORD }
  - name: MONGO_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: MONGO_PASSWORD }
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: REDIS_PASSWORD }
  - name: RABBITMQ_PASSWORD
    valueFrom:
      secretKeyRef: { name: platform-credentials, key: RABBITMQ_PASSWORD }

  # ── Çalışma ortamı ───────────────────────────────────────────────────────────
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: TZ
    value: Europe/Istanbul

  # ── Veri katmanı ─────────────────────────────────────────────────────────────
  # Tek veritabanı (inktavia_store), modül başına ayrı PostgreSQL şeması.
  # Maximum Pool Size=12 KRİTİK: max_connections=200 ve 15 servis var (15×12=180).
  # appsettings'teki 300 değeri 15 modülde 4500 bağlantı demekti.
  - name: DatabaseSettings__ServiceRequest__ConnectionString
    value: "Host=postgres;Port=5432;Database=inktavia_store;Username=aizen;Password=$(POSTGRES_PASSWORD);Maximum Pool Size=12"
  - name: DatabaseSettings__ServiceRequestMongo__ConnectionString
    value: "mongodb://aizen:$(MONGO_PASSWORD)@mongo:27017/ServiceRequest?authSource=admin"
  - name: DistributedCache__InstanceName
    value: "ServiceRequest:"
  # Tüm modüller Redis db 13'ü paylaşıyor; anahtarlar InstanceName ile ayrışıyor.
  - name: DistributedCache__Configuration
    value: "redis:6379,password=$(REDIS_PASSWORD),abortConnect=False,defaultDatabase=13"

  - name: MessageBroker__QueueSettings__HostName
    value: "rabbitmq"
  - name: MessageBroker__QueueSettings__Port
    value: "5672"
  - name: MessageBroker__QueueSettings__VirtualHost
    value: "/"
  - name: MessageBroker__QueueSettings__UserName
    value: "aizen"
  - name: MessageBroker__QueueSettings__Password
    value: "$(RABBITMQ_PASSWORD)"

  # ── BFF assertion — bu olmadan modül AÇILMAZ ─────────────────────────────────
  # Core/InfoAccessor, Development dışında boş SharedSecret ile başlatmayı
  # fail-closed olarak reddediyor: modülün tek kimlik güvencesi bu sır.
  - name: BffAssertion__SharedSecret
    valueFrom:
      secretKeyRef: { name: bff-assertion, key: SharedSecret }
  - name: BffAssertion__AllowedClientIds__0
    value: "admin-panel-bff"
  - name: BffAssertion__AllowedClientIds__1
    value: "provider-portal-bff"
  - name: BffAssertion__AllowedClientIds__2
    value: "marine-web-bff"
  - name: BffAssertion__AllowedClientIds__3
    value: "marine-mobile-bff"

  # ── Seed/mock kapatma — AÇIKÇA ───────────────────────────────────────────────
  # Çoğu modülün appsettings.Production.json'ı bunları zaten kapatıyor, ama
  # CargoDry'nin Production dosyası HİÇ YOK ve base'e düşüyor. Sessiz varsayılana
  # güvenmek yerine hepsinde açıkça kapatıyoruz — üretime mock veri sızması
  # geri alınması zor bir hatadır.
  - name: MockData__Enabled
    value: "false"
  - name: MockData__RunOnStartup
    value: "false"
  - name: ReferenceDataSeed__Enabled
    value: "false"
  - name: CargoDrySeed__Enabled
    value: "false"
  - name: MessagingSeed__Enabled
    value: "false"
  - name: NotificationSeed__Enabled
    value: "false"
  - name: PaymentSeed__Enabled
    value: "false"
  - name: RemoteCalls__IPaymentModuleRemoteCall__BaseUrl
    value: "http://aizen-payment"
  - name: RemoteCalls__IServiceRequestReferenceDataRemoteCall__BaseUrl
    value: "http://aizen-referencedata"
