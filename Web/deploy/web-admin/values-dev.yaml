# web-admin — dev degerleri (inktavia-dev)
#
# ⚠️ BU DOSYA PUBLIC BIR REPODA. Buradaki hicbir deger sir degil: hepsi zaten
#    tarayiciya iniyor (SPA'da "gizli" yapilandirma diye bir sey yoktur).
#
# ⚠️ Bu chart, AYRI BIR REPODAN gelen bir image'i deploy ediyor:
#    github.com/CihanCakir/inktavia-marine-admin-web
#    Bu yuzden platform monorepo'sunun TEK ETIKET kuralina dahil DEGIL —
#    kendi sha'si var ve gitops/apps/web-admin-app.yaml icinde duruyor.
#
# ✅ FAZ24 (2026-08-24): DEV SPA HOST'U KAYDEDILDI — FAZ20'nin "uydurmuyorum" blogu cozuldu.
#    Cloudflare Tunnel'a 14. yonlendirme eklendi ve listeden geri-okundu:
#      dev-admin.inktavia.com → http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
#    (dev-provider.inktavia.com ile ayni kalip; DNS kaydini tunel kendisi olusturur.)
#    Bu yuzden asagida ingress ACIK ve replicaCount 1. Admin auth modu 'identity'
#    oldugundan Keycloak redirect_uri GEREKMIYOR — tunel + ingress yeterli.

replicaCount: 1

image:
  repository: ghcr.io/cihancakir/inktavia/web-admin
  pullPolicy: IfNotPresent
  # Bos: Argo CD Application'daki `image.tag` parametresi dolduruyor.
  # Bos kalirsa helm render asamasinda YUKSEK SESLE patlar (required).
  tag: ""

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# nginx-unprivileged imaji zaten uid 101 ile kosuyor; burada dogruluyoruz.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # ⚠️ readOnlyRootFilesystem BILEREK KAPALI. Acilista entrypoint
  # /usr/share/nginx/html/config.js dosyasini YENIDEN YAZIYOR, nginx de
  # /var/cache/nginx ve /tmp'ye yaziyor. Acarsan konteyner acilista oler.

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  # FAZ24: host kaydedildi (yukaridaki not) — acik.
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
  hosts:
    - host: dev-admin.inktavia.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

probes:
  path: /healthz

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ── ORTAM AYARI ─────────────────────────────────────────────────────────────
# ConfigMap'e gidiyor, oradan konteyner ortamina, oradan /config.js'e.
# Iki deger ZORUNLU (entrypoint eksikse konteyneri baslatmiyor):
#   VITE_APP_ENV, VITE_ADMIN_PANEL_BFF_BASE_URL
# (Admin varsayilan auth modu 'identity' → Keycloak degiskenleri opsiyonel.)
runtimeEnv:
  VITE_APP_NAME: "Inktavia Marine Admin"
  VITE_APP_ENV: "development"
  VITE_AUTH_MODE: "identity"
  # Dev admin BFF'i tunel uzerinden. Tarayicidan cagrildigi icin PUBLIC adres olmali —
  # cluster ici "http://aizen-bff-adminpanel" burada CALISMAZ. Host FAZ20'de olculdu:
  # Bff/deploy/aizen-bff-adminpanel/values-dev.yaml:63 → dev-admin-api.inktavia.com
  VITE_ADMIN_PANEL_BFF_BASE_URL: "https://dev-admin-api.inktavia.com/api/v1/admin-panel"
  # ── FAZ25 (2026-08-24): Keycloak uclusu ZORUNLUYMUS ─────────────────────────
  # "identity modu → Keycloak degiskenleri opsiyonel" varsayimi YANLIS cikti: OTP girisi
  # dogrulama sonrasi login_ticket ile Keycloak handoff'una gidiyor (BFF NextAction=
  # redirect_to_keycloak_handoff) ve keycloakClient.loginWithTicket bu uc deger olmadan
  # `await init`te SESSIZCE asili kaliyor — kullanici "bekledik, hicbir sey olmadi" gorur.
  # Provider values-dev'indeki uclunun birebir karsiligi:
  VITE_KEYCLOAK_URL: "https://auth.inktavia.com"
  VITE_KEYCLOAK_REALM: "inktavia-realm"
  VITE_KEYCLOAK_CLIENT_ID: "admin-panel"
  VITE_DEFAULT_LANGUAGE: "en"
  VITE_SUPPORTED_LANGUAGES: "en,tr"
