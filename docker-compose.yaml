name: aizen-inktavia-local

services:
  # Databases
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aizen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aizenpw}
      POSTGRES_DB: ${POSTGRES_DB:-aizen}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    networks: [aizen]

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-aizen}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-aizenpw}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [aizen]

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks: [aizen]

  # Keycloak and its DB (separate DB to avoid mixing schemas)
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloakpw}
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
    volumes:
      - kc_pg_data:/var/lib/postgresql/data
    networks: [aizen]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    depends_on:
      - keycloak-db
    command: ["start-dev", "--import-realm", "--http-port=8080", "--spi-connections-http-client-default-disable-trust-manager=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloakpw}

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: "none"
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/inktavia-realm-realm.json:/opt/keycloak/data/import/inktavia-realm-realm.json:ro
    networks: [aizen]

  keycloak-init:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak-init
    depends_on:
      - keycloak
    entrypoint: ["/bin/bash", "/init/init.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/keycloak/init.sh:/init/init.sh:ro
    networks: [aizen]
    restart: "no"

  # Messaging (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aizen}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-aizenpw}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    networks: [aizen]

  # BFF layer

  bff-adminpanel:
    build:
      context: .
      dockerfile: ./Bff/build/Dockerfile.AdminPanel
    container_name: bff-adminpanel
    depends_on:
      - keycloak
      - rabbitmq
      - identity-api
      - vessel-api
      - file-storage-api
      - service-request-api
      - reference-data-api
      - cargodry-api
      - messaging-api
      - notification-api
      - payment-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      MessageBroker__QueueSettings__HostName: rabbitmq
      MessageBroker__QueueSettings__Port: 5672
      MessageBroker__QueueSettings__UserName: ${RABBITMQ_USER:-aizen}
      MessageBroker__QueueSettings__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: bff-adminpanel
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
      KeycloakServiceToken__ClientSecret: ${KEYCLOAK_BFF_CLIENT_SECRET:-local-dev-only-change-me}
      RemoteCalls__IIdentityAdminBffRemoteCall__BaseUrl: http://identity-api:8080
      RemoteCalls__IVesselAdminBffRemoteCall__BaseUrl: http://vessel-api:8080
      RemoteCalls__IFileStorageAdminBffRemoteCall__BaseUrl: http://file-storage-api:8080
      RemoteCalls__IServiceRequestAdminBffRemoteCall__BaseUrl: http://service-request-api:8080
      RemoteCalls__IReferenceDataAdminBffRemoteCall__BaseUrl: http://reference-data-api:8080
      RemoteCalls__IAdminCargoDryBffRemoteCall__BaseUrl: http://cargodry-api:8080
      RemoteCalls__IAdminMessagingBffRemoteCall__BaseUrl: http://messaging-api:8080
      RemoteCalls__INotificationBffRemoteCall__BaseUrl: http://notification-api:8080
      RemoteCalls__INotificationAdminBffRemoteCall__BaseUrl: http://notification-api:8080
      RemoteCalls__IAdminPaymentBffRemoteCall__BaseUrl: http://payment-api:8080
    ports:
      - "${BFF_ADMINPANEL_PORT:-17001}:8080"
    networks: [aizen]

  bff-marineprovider:
    build:
      context: .
      dockerfile: ./Bff/build/Dockerfile.MarineProvider
    container_name: bff-marineprovider
    depends_on:
      - keycloak
      - rabbitmq
      - identity-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      MessageBroker__QueueSettings__HostName: rabbitmq
      MessageBroker__QueueSettings__Port: 5672
      MessageBroker__QueueSettings__UserName: ${RABBITMQ_USER:-aizen}
      MessageBroker__QueueSettings__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      # Inbound auth (Keycloak full IdP). Authority = browser-facing issuer; MetadataAddress = in-cluster JWKS.
      MarineProviderKeycloak__BaseUrl: http://keycloak:8080
      MarineProviderKeycloak__Authority: http://localhost:8080/realms/inktavia-realm
      MarineProviderKeycloak__MetadataAddress: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      MarineProviderKeycloak__Realm: inktavia-realm
      MarineProviderKeycloak__Audience: provider-portal-bff
      MarineProviderKeycloak__RequireHttpsMetadata: "false"
      MarineProviderKeycloak__AdminClientId: provider-portal-bff
      MarineProviderKeycloak__AdminClientSecret: ${KEYCLOAK_PROVIDER_BFF_CLIENT_SECRET:-local-dev-only-change-me}
      MarineProviderKeycloak__ProviderPortalClientId: provider-portal
      MarineProviderKeycloak__ProviderPortalBffClientId: provider-portal-bff
      MarineProviderKeycloak__ProviderPendingRole: provider_pending
      MarineProviderKeycloak__ProviderUserRole: provider_user
      MarineProviderKeycloak__ProviderRestrictedRole: provider_restricted
      MarineProviderKeycloak__ProviderProfileIdAttributeName: provider_profile_id
      MarineProviderKeycloak__VerifyEmailRedirectUri: ${PROVIDER_WEB_BASE:-http://localhost:3002}/auth/verify-callback
      # BFF → module calls (Keycloak service token injected by the delegating handler)
      RemoteCalls__IProviderIdentityRemoteCall__BaseUrl: http://identity-api:8080
    ports:
      - "${BFF_MARINEPROVIDER_PORT:-17002}:8080"
    networks: [aizen]

  # Example modules (expand as needed)
  minio:
    image: minio/minio:latest
    container_name: inktavia-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aizen]

  minio-init:
    image: minio/mc:latest
    container_name: inktavia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/${MINIO_BUCKET_NAME:-inktavia-filestorage-local};
      mc anonymous set none local/${MINIO_BUCKET_NAME:-inktavia-filestorage-local};
      exit 0;
      "
    networks: [aizen]

  # Example modules (expand as needed)
  identity-api:
    build:
      context: .
      dockerfile: ./Modules/Identity/build/Dockerfile
    container_name: identity-api
    depends_on:
      - postgres
      - redis
      - keycloak
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: Host=postgres;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      Redis__Host: redis:6379
      Identity__Authority: http://keycloak:8080/realms/${KC_REALM:-inktavia-realm}
      Messaging__RabbitMQ__Host: rabbitmq
      Messaging__RabbitMQ__Port: 5672
      Messaging__RabbitMQ__User: ${RABBITMQ_USER:-aizen}
      Messaging__RabbitMQ__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: identity-api
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
      ElasticApm__Enabled: "false"
      IdentityKeycloak__Enabled: "true"
      IdentityKeycloak__BaseUrl: http://keycloak:8080
      IdentityKeycloak__Realm: inktavia-realm
      IdentityKeycloak__AdminClientId: provider-portal-bff
      IdentityKeycloak__AdminClientSecret: ${KEYCLOAK_PROVIDER_BFF_CLIENT_SECRET}
      IdentityKeycloak__ProviderPendingRole: provider_pending
      IdentityKeycloak__ProviderUserRole: provider_user
      IdentityKeycloak__ProviderRestrictedRole: provider_restricted
      IdentityKeycloak__RevokeSessionsOnSuspend: "false"
    ports:
      - "7101:8080"
    networks: [aizen]

  reference-data-api:
    build:
      context: .
      dockerfile: ./Modules/ReferenceData/build/Dockerfile
    container_name: reference-data-api
    depends_on:
      - postgres
      - mongo
      - redis
      - keycloak
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      Mongo__ConnectionString: mongodb://${MONGO_USER:-aizen}:${MONGO_PASSWORD:-aizenpw}@mongo:27017
      Redis__Host: redis:6379
      Messaging__RabbitMQ__Host: rabbitmq
      Messaging__RabbitMQ__Port: 5672
      Messaging__RabbitMQ__User: ${RABBITMQ_USER:-aizen}
      Messaging__RabbitMQ__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: reference-data-api
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
    ports:
      - "7104:8080"
    networks: [aizen]

  vessel-api:
    build:
      context: .
      dockerfile: ./Modules/Vessel/build/Dockerfile
    container_name: vessel-api
    depends_on:
      - postgres
      - redis
      - keycloak
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      Redis__Host: redis:6379
      Messaging__RabbitMQ__Host: rabbitmq
      Messaging__RabbitMQ__Port: 5672
      Messaging__RabbitMQ__User: ${RABBITMQ_USER:-aizen}
      Messaging__RabbitMQ__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: vessel-api
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
    ports:
      - "7105:8080"
    networks: [aizen]

  file-storage-api:
    build:
      context: .
      dockerfile: ./Modules/FileStorage/build/Dockerfile
    container_name: file-storage-api
    depends_on:
      - postgres
      - mongo
      - redis
      - keycloak
      - rabbitmq
      - minio-init
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      Mongo__ConnectionString: mongodb://${MONGO_USER:-aizen}:${MONGO_PASSWORD:-aizenpw}@mongo:27017
      Redis__Host: redis:6379
      Messaging__RabbitMQ__Host: rabbitmq
      Messaging__RabbitMQ__Port: 5672
      Messaging__RabbitMQ__User: ${RABBITMQ_USER:-aizen}
      Messaging__RabbitMQ__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: file-storage-api
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
      S3ObjectStorage__Provider: MinIO
      S3ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      S3ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3ObjectStorage__Region: us-east-1
      S3ObjectStorage__BucketName: ${MINIO_BUCKET_NAME:-inktavia-filestorage-local}
      S3ObjectStorage__ServiceUrl: http://minio:9000
      S3ObjectStorage__ForcePathStyle: "true"
      S3ObjectStorage__UseHttp: "true"
    ports:
      - "7106:8080"
    networks: [aizen]

  service-request-api:
    build:
      context: .
      dockerfile: ./Modules/ServiceRequest/build/Dockerfile
    container_name: service-request-api
    depends_on:
      - postgres
      - mongo
      - redis
      - keycloak
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      Mongo__ConnectionString: mongodb://${MONGO_USER:-aizen}:${MONGO_PASSWORD:-aizenpw}@mongo:27017
      Redis__Host: redis:6379
      Messaging__RabbitMQ__Host: rabbitmq
      Messaging__RabbitMQ__Port: 5672
      Messaging__RabbitMQ__User: ${RABBITMQ_USER:-aizen}
      Messaging__RabbitMQ__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: service-request-api
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
    ports:
      - "7107:8080"
    networks: [aizen]

  cargodry-api:
    build:
      context: .
      dockerfile: ./Modules/CargoDry/build/Dockerfile
    container_name: cargodry-api
    depends_on:
      - postgres
      - mongo
      - redis
      - keycloak
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CargoDry: Host=postgres;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      ConnectionStrings__CargoDryMongo: mongodb://${MONGO_USER:-aizen}:${MONGO_PASSWORD:-aizenpw}@mongo:27017
      MongoDb__DatabaseName: aizen_cargodry
      DistributedCache__InstanceName: "CargoDry:"
      DistributedCache__Configuration: redis:6379,abortConnect=False
      MessageBroker__QueueSettings__HostName: rabbitmq
      MessageBroker__QueueSettings__Port: 5672
      MessageBroker__QueueSettings__UserName: ${RABBITMQ_USER:-aizen}
      MessageBroker__QueueSettings__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      MessageBroker__QueueSettings__VirtualHost: ${RABBITMQ_VHOST:-/}
      CargoDry__ActivationTokenSecret: ${CARGODRY_ACTIVATION_SECRET:-local-dev-only-change-me-32chars!!!}
      CargoDry__ActivationTokenTtlMinutes: 5
      CargoDry__RateLimiting__ValidateEndpoint__PermitLimit: 100
      CargoDry__RateLimiting__ValidateEndpoint__WindowSeconds: 60
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: cargodry-api
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
      ElasticApm__Enabled: "false"
    ports:
      - "7108:8080"
    networks: [aizen]

  messaging-api:
    build:
      context: .
      dockerfile: ./Modules/Messaging/build/Dockerfile
    container_name: messaging-api
    depends_on:
      - postgres
      - mongo
      - redis
      - keycloak
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Messaging: Host=postgres;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      Mongo__ConnectionString: mongodb://${MONGO_USER:-aizen}:${MONGO_PASSWORD:-aizenpw}@mongo:27017
      DistributedCache__InstanceName: "Messaging:"
      DistributedCache__Configuration: redis:6379,abortConnect=false,defaultDatabase=13
      MessageBroker__QueueSettings__HostName: rabbitmq
      MessageBroker__QueueSettings__Port: 5672
      MessageBroker__QueueSettings__UserName: ${RABBITMQ_USER:-aizen}
      MessageBroker__QueueSettings__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      MessageBroker__QueueSettings__VirtualHost: ${RABBITMQ_VHOST:-/}
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: messaging-api
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
      ElasticApm__Enabled: "false"
    ports:
      - "7109:8080"
    networks: [aizen]

  notification-api:
    build:
      context: .
      dockerfile: ./Modules/Notification/build/Dockerfile
    container_name: notification-api
    depends_on:
      - postgres
      - redis
      - keycloak
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Notification: Host=postgres;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      DistributedCache__InstanceName: "Notification:"
      DistributedCache__Configuration: redis:6379,abortConnect=false,defaultDatabase=13
      MessageBroker__QueueSettings__HostName: rabbitmq
      MessageBroker__QueueSettings__Port: 5672
      MessageBroker__QueueSettings__UserName: ${RABBITMQ_USER:-aizen}
      MessageBroker__QueueSettings__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      MessageBroker__QueueSettings__VirtualHost: ${RABBITMQ_VHOST:-/}
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: notification-api
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
      ElasticApm__Enabled: "false"
    ports:
      - "7110:8080"
    networks: [aizen]

  payment-api:
    build:
      context: .
      dockerfile: ./Modules/Payment/build/Dockerfile
    container_name: payment-api
    depends_on:
      - postgres
      - redis
      - keycloak
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      DatabaseSettings__Payment__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      DatabaseSettings__PaymentScheduler__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aizen};Username=${POSTGRES_USER:-aizen};Password=${POSTGRES_PASSWORD:-aizenpw}
      DistributedCache__InstanceName: "Payment:"
      DistributedCache__Configuration: redis:6379,abortConnect=False,defaultDatabase=14
      MessageBroker__QueueSettings__HostName: rabbitmq
      MessageBroker__QueueSettings__Port: 5672
      MessageBroker__QueueSettings__UserName: ${RABBITMQ_USER:-aizen}
      MessageBroker__QueueSettings__Password: ${RABBITMQ_PASSWORD:-aizenpw}
      MessageBroker__QueueSettings__VirtualHost: ${RABBITMQ_VHOST:-/}
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/inktavia-realm
      KEYCLOAK_METADATA_ADDRESS: http://keycloak:8080/realms/inktavia-realm/.well-known/openid-configuration
      KEYCLOAK_AUDIENCE: payment-api
      KEYCLOAK_REQUIRE_HTTPS_METADATA: "false"
      Iyzico__ApiKey: ${IYZICO_API_KEY:-sandbox_api_key_placeholder}
      Iyzico__SecretKey: ${IYZICO_SECRET_KEY:-sandbox_secret_key_placeholder}
      Iyzico__BaseUrl: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      Iyzico__WebhookSecret: ${IYZICO_WEBHOOK_SECRET:-}
      Iyzico__CallbackUrl: ${IYZICO_CALLBACK_URL:-http://localhost:3000/payment/callback}
      Scheduler__StorageType: PostgreSQL
      Scheduler__RetryAttempts: 3
      Scheduler__UseFilter: "true"
      Scheduler__RouteUrl: /hangfire
      Scheduler__DatabaseKey: PaymentScheduler
      Scheduler__SchemaName: payment-scheduler
      ElasticApm__Enabled: "false"
    ports:
      - "${PAYMENT_API_PORT:-7102}:8080"
    networks: [aizen]

  # Load testing - k6
  k6:
    image: grafana/k6:0.49.0
    container_name: k6
    command: ["run", "/scripts/example.js"]
    environment:
      K6_OUT: "json"
    volumes:
      - ./load-test/scripts:/scripts:ro
    depends_on:
      - bff-adminpanel
    networks: [aizen]

  # Observability: Prometheus & Grafana
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [aizen]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    depends_on:
      - prometheus
    networks: [aizen]

networks:
  aizen:
    name: aizen

volumes:
  pg_data:
  mongo_data:
  kc_pg_data:
  minio_data:
