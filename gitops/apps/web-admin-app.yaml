# Admin Panel (dev) — Argo CD Application.
#
# NEDEN ApplicationSet DEGIL:
# gitops/apps/{prod,dev}-appset.yaml build/components.json'dan uretiliyor ve
# TEK ETIKET kuralina dayaniyor: 15 bilesenin hepsi ayni sha'yi paylasiyor,
# cunku hepsi ayni monorepo'dan derleniyor. web-admin AYRI BIR REPODAN
# (github.com/CihanCakir/inktavia-marine-admin-web) geliyor; oraya konsaydi
# platform'un sha'sini miras alirdi ve o sha ile web-admin diye bir image hic
# uretilmemis olurdu → ImagePullBackOff. Bu yuzden components.json'a EKLENMEDI.
#
# ⚠️ Bu dosya Argo CD tarafindan YONETILMIYOR — gitops/apps/ altindaki her sey
#    gibi bir kez elle uygulaniyor:
#        kubectl apply -f gitops/apps/web-admin-app.yaml
#
# ✅ FAZ24 (2026-08-24): FAZ20'nin iki eksigi de kapandi — artik uygulanabilir:
#    (1) dev SPA host'u kaydedildi (tunel rotasi 14: dev-admin.inktavia.com → ingress-nginx),
#        values-dev'de ingress ACIK, replicaCount 1.
#    (2) ilk web-admin image'i uretildi: CI #4 (develop push f54bcea) → sha-f54bcea + :dev.
#    Ilk kurulum ELLE: kubectl apply -f gitops/apps/web-admin-app.yaml (#33: app-of-apps yok).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-admin-dev
  namespace: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CihanCakir/inktavia-platform.git
    targetRevision: develop
    path: Web/deploy/web-admin
    helm:
      # ⚠️ releaseName sabit: ileride appset'e tasirken ayni kalmali, yoksa
      # Argo CD kaynaklari devralmaz, YENILERINI yaratir ve iki kopya kosar.
      releaseName: web-admin
      valueFiles:
        - values-dev.yaml
      parameters:
        # ▼▼▼ TEK SURUM ISARETCISI — elle guncelleniyor ▼▼▼
        # FAZ20 (#55): Bu satir HALA elle guncelleniyor (cross-repo auto-commit YAPILMADI —
        # public repoya yazma yetkili bir token gerektirirdi; o ayri bir guvenlik/provenance
        # kararidir, sessizce alinmaz). AMA artik UNUTMAK SESSIZ DEGIL: platform CI'inda
        # build/ci/gitops-frontend-isaretci-denetimi.sh her PR/push'ta bu image.tag'i GHCR'daki
        # en yeni ':dev' image'inin digest'iyle kiyaslar; tutmuyorsa CI YUKSEK SESLE patlar.
        # Etiket bicimi frontend CI'dan: .github/workflows/ci.yml → sha-$(git rev-parse --short=7 HEAD).
        - name: image.tag
          # FAZ24: ilk gercek image (admin-web CI #4, develop merge f54bcea — faz24/ci-ve-tip-duzeltmeleri).
          value: "sha-2a7d73f"
        # ▲▲▲
  destination:
    server: https://kubernetes.default.svc
    namespace: inktavia-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
