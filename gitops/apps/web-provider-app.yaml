# Provider Portal (dev) — Argo CD Application.
#
# NEDEN ApplicationSet DEGIL:
# gitops/apps/{prod,dev}-appset.yaml build/components.json'dan uretiliyor ve
# TEK ETIKET kuralina dayaniyor: 15 bilesenin hepsi ayni sha'yi paylasiyor,
# cunku hepsi ayni monorepo'dan derleniyor. web-provider AYRI BIR REPODAN
# geliyor; oraya konsaydi platform'un sha'sini miras alirdi ve o sha ile
# web-provider diye bir image hic uretilmemis olurdu → ImagePullBackOff.
#
# ⚠️ Bu dosya Argo CD tarafindan YONETILMIYOR — gitops/apps/ altindaki her sey
#    gibi bir kez elle uygulaniyor:
#        kubectl apply -f gitops/apps/web-provider-app.yaml
#    Ikinci frontend geldiginde bunu web-{dev,prod}-appset.yaml'a donusturecegiz.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-provider-dev
  namespace: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CihanCakir/inktavia-platform.git
    targetRevision: develop
    path: Web/deploy/web-provider
    helm:
      # ⚠️ releaseName sabit: ileride appset'e tasirken ayni kalmali, yoksa
      # Argo CD kaynaklari devralmaz, YENILERINI yaratir ve iki kopya kosar.
      releaseName: web-provider
      valueFiles:
        - values-dev.yaml
      parameters:
        # ▼▼▼ TEK SURUM ISARETCISI — elle guncelleniyor ▼▼▼
        # FAZ20 (#55): Bu satir HALA elle guncelleniyor (cross-repo auto-commit YAPILMADI — public
        # repoya yazma yetkili token gerektirirdi; ayri bir guvenlik/provenance karari). AMA artik
        # UNUTMAK SESSIZ DEGIL: platform CI'inda build/ci/gitops-frontend-isaretci-denetimi.sh her
        # PR/push'ta bu image.tag'i GHCR'daki en yeni ':dev' image'inin digest'iyle kiyaslar; tutmuyorsa
        # CI YUKSEK SESLE patlar. Yani bu satiri guncellemeyi unutursan platform CI kirmizi olur —
        # cluster sessizce eski image'i servis etmeye devam etmez. (Denetim TUM web-*-app.yaml'lari kapsar.)
        - name: image.tag
          # 2026-08-25: sha-de8d1b4 → sha-46116de (provider-web PR #9 faz5/complete; CI #20 yesil).
          # 2026-08-24: sha-85eaeb1 → sha-de8d1b4 (PR #7 fix/keycloack + PR #8 fix/mvp-phase1; CI #18 yesil).
          # 2026-08-23: sha-2dd05c4 → sha-85eaeb1 (Faz 22 — giriş sayfasındaki sahte parola
          #   alanı kaldırıldı, #87). GHCR'de doğrulandı: sha-85eaeb1 ':dev' etiketini taşıyor,
          #   ve commit 85eaeb1'de LoginPage.tsx'te PasswordInput/CheckboxField YOK, login.continue VAR.
          # 🔴 Bu satır 2026-08-22'de sha-2dd05c4'te SIKIŞTI ve kimse fark etmedi: frontend'e iki kez
          #   merge edildi, platform'a dokunulmadı, hiçbir sinyal çıkmadı. Yakalaması gereken denetim
          #   (#55) YALNIZ cron ile tetiklenirdi ve cron HİÇ ateşlenmiyor — GitHub zamanlanmış işleri
          #   yalnız VARSAYILAN DALDAN koşturur, bu workflow ise sadece develop'ta (main'de 404).
          # 2026-08-22: sha-b349367 → sha-2dd05c4 (Faz 11/12A/13B/17 frontend işi).
          # Etiket biçimi CI'dan: .github/workflows/ci.yml:85 → `sha-$(git rev-parse --short=7 HEAD)`.
          # ⚠️ Image YALNIZ develop'a PUSH'ta üretiliyor (ci.yml:57 `if: push && ref == develop`),
          #    PR'da değil. Uygulamadan önce etiketin GHCR'da var olduğu doğrulanmalı — yoksa
          #    ImagePullBackOff (bu dosyanın başındaki uyarının aynısı).
          value: "sha-0de9989"
        # ▲▲▲
  destination:
    server: https://kubernetes.default.svc
    namespace: inktavia-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
