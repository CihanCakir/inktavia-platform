# Inktavia — host stack (k3s DIŞI stateful altyapı)
#
# Bu dosya inktavia-node-1 üzerinde docker ile çalışır; uygulama servisleri (modüller,
# BFF'ler, frontend'ler) k3s'te olduğu için burada YOKTUR.
#
# Neden k3s dışında: infrastructure/k8s/README.md bunu şart koşuyor. Tek node'lu bir
# cluster'da PostgreSQL'i pod olarak koşturmak, node yeniden başladığında veri riski ve
# kurtarma karmaşıklığı demek. Ayrıca bellek sınırını burada `mem_limit` ile doğrudan
# kontrol edebiliyoruz — 15,9 GB'lık bir kutuda bu belirleyici.
#
# Kullanım:
#   cd /srv/host-stack
#   docker compose -f docker-compose.prod.yaml up -d
#
# Portlar 0.0.0.0'a DEĞİL, LAN adresine bağlanır: Docker yayınlanan portlar için UFW'yi
# atlar (kendi iptables zincirlerini önce ekler), bu yüzden dinlenen adresi biz kısıtlıyoruz.
# Modemde port yönlendirme olmadığı için dışarıdan erişim yoktur.

name: inktavia-host-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─────────────────────────────────────────────────────────────────────
  # PostgreSQL — uygulama veritabanı (SSD)
  # ─────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1200m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-inktavia_store}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=200
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_compression=on
    ports:
      - "${BIND_IP}:5432:5432"
    volumes:
      - /srv/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-inktavia_store}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aizen]

  # ─────────────────────────────────────────────────────────────────────
  # MongoDB — ReferenceData konum dokümanları (SSD)
  # ─────────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 900m
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: ["--wiredTigerCacheSizeGB", "0.5", "--bind_ip_all"]
    ports:
      - "${BIND_IP}:27017:27017"
    volumes:
      - /srv/data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [aizen]

  # ─────────────────────────────────────────────────────────────────────
  # Redis — SignalR backplane + cache + rate-limit sayaçları
  # Kalıcılık yok (backplane ve cache); maxmemory-policy volatile-lru çünkü
  # allkeys-lru, TTL'siz anahtarları da atıp rate-limit sayaçlarını sıfırlayabilir.
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 300m
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "${BIND_IP}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [aizen]

  # ─────────────────────────────────────────────────────────────────────
  # RabbitMQ — modüller arası event bus
  # ─────────────────────────────────────────────────────────────────────
  # ── ELK log yığını (2026-09-08, Faz L) ──────────────────────────────────────────
  # NEDEN host'ta: durum tutan her sey host'ta konvansiyonu (postgres/mongo/redis ile ayni).
  # Portlar YALNIZ ${BIND_IP} — internete kapali; Kibana'ya dis erisim Cloudflare Tunnel+Access ile.
  # ON KOSUL (bir kez): sudo sysctl -w vm.max_map_count=262144  (+ /etc/sysctl.d/99-elasticsearch.conf)
  # Sirlar .env'den: ELASTIC_PASSWORD, KIBANA_SYSTEM_PASSWORD (out-of-band, read -s ile).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    environment:
      - discovery.type=single-node        # TEK NODE: HA yok — dev icin bilincli sinir
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.name=inktavia-elk
    ports:
      - "${BIND_IP}:9200:9200"   # yalniz LAN — cluster'daki Filebeat + Kibana buradan yazar/okur
    volumes:
      - /srv/data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [aizen]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    depends_on: [elasticsearch]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - SERVER_PUBLICBASEURL=https://dev-elk.inktavia.com
      - TELEMETRY_ENABLED=false
    ports:
      - "${BIND_IP}:5601:5601"   # yalniz LAN — dis erisim Tunnel+Access uzerinden
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q available || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [aizen]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    # hostname SABIT olmali: RabbitMQ veritabanini node adina (rabbit@<hostname>) gore tutar.
    # Hostname'siz her recreate yeni rastgele hostname = bos broker demek (2026-09-07'de yasandi).
    hostname: rabbitmq
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 400m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${BIND_IP}:5672:5672"     # AMQP
      - "${BIND_IP}:15672:15672"   # Management UI — yalnız LAN
      - "${BIND_IP}:15692:15692"   # prometheus metrikleri — yalnız LAN (monitoring Faz A)
    volumes:
      - /srv/data/rabbitmq:/var/lib/rabbitmq
      # rabbitmq_prometheus plugin'i (monitoring Faz A) — recreate'te de acik kalsin
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks: [aizen]

  # ─────────────────────────────────────────────────────────────────────
  # MinIO — nesne deposu (HDD, sıralı I/O yeterli)
  # ─────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 300m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # FAZ21 (#78): tarayıcı presigned PUT'ları DOĞRUDAN MinIO'ya gider → yükleyen HER portalın
      # origin'i burada olmalı; yoksa preflight (OPTIONS) reddedilir ve yükleme %0'da asılı kalır.
      # Liste ÖLÇÜLDÜ (presign uçlarının olduğu BFF'ler): AdminPanel BFF (admin.inktavia.com),
      # MarineProvider BFF (provider.inktavia.com + dev-provider.inktavia.com — bu fazın kırık akışı).
      # partner.inktavia.com KORUNDU (önceden vardı). Mobil BFF de presign'liyor ama istemci NATIVE
      # (RN) → tarayıcı CORS'u uygulamaz, origin gerekmez. dev-admin origin'i YOK: admin SPA'nın dev
      # host'u henüz kayıtlı değil (Faz20); o host açılınca buraya eklenmeli.
      # ⚠️ Çalışan yığın MINIO_CORS_ORIGINS'i /srv/host-stack/.env'den OKUR (varsa) → bu default'u
      #    EZEBİLİR. Cihan CANLI değeri (.env) kontrol etmeli; sadece bu dosya yetmez.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:-https://admin.inktavia.com,https://partner.inktavia.com,https://provider.inktavia.com,https://dev-provider.inktavia.com}
    ports:
      - "${BIND_IP}:9000:9000"
      - "${BIND_IP}:9001:9001"     # konsol — yalnız LAN
    volumes:
      - /srv/objects/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [aizen]

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    restart: "no"
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET_NAME:-inktavia-filestorage};
      mc anonymous set none local/${MINIO_BUCKET_NAME:-inktavia-filestorage};
      exit 0;
      "
    networks: [aizen]

  # ─────────────────────────────────────────────────────────────────────
  # Keycloak + kendi veritabanı
  # Sürüm 25.0.0'da SABİT: realm export'u ve özel OTP SPI jar'ı bu sürüme göre
  # derlendi. Yükseltme ayrı bir iş, burada değil.
  # ─────────────────────────────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 300m
    environment:
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
    volumes:
      - /srv/data/keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aizen]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1024m
    depends_on:
      keycloak-db:
        condition: service_healthy
    # start-dev DEĞİL: üretim modu.
    # 🔴 2026-08-23 OLAYI (#92) — BU BLOK BİR KEZ VERİ KAYBIYLA EZİLDİ, DİKKAT:
    #   Sunucudaki compose'a Faz 9/10'da ELLE hostname sabitlemesi yapılmıştı
    #   (--hostname=https://auth.inktavia.com + --hostname-admin + --hostname-backchannel-dynamic)
    #   ama depoya GERİ İŞLENMEMİŞTİ; burada hâlâ "Faz 9'da sabitlenecek" yazıyordu.
    #   #84 senkronunda depo sürümü sunucuya kopyalanınca çalışan yapılandırma bayat
    #   --hostname-strict=false ile ezildi ve OTP login_ticket akışı KIRILDI (parola
    #   girişi çalışmaya devam etti — fark ancak OTP denenince görüldü). Yedekle diff
    #   alınarak bulundu ve üç bayrak buraya GERİ İŞLENDİ. Ders: sunucu-depo farkı
    #   elle yapılmış bir düzeltme olabilir; diff'lemeden üzerine YAZMA.
    #   hostname-backchannel-dynamic=true: küme içi BFF http://keycloak:8080'den konuşur
    #   (OTP bilet akışı buna bağlı), tarayıcı https://auth.inktavia.com görür.
    command:
      - start
      - --import-realm
      - --http-port=8080
      - --http-enabled=true
      - --hostname=https://auth.inktavia.com
      - --hostname-admin=http://192.168.1.50:8080
      - --hostname-backchannel-dynamic=true
      - --proxy-headers=xforwarded
      - --spi-connections-http-client-default-disable-trust-manager=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-INFO}
      JAVA_OPTS_APPEND: "-Xmx768m -XX:MaxMetaspaceSize=192m"
    ports:
      - "${BIND_IP}:8080:8080"
    volumes:
      - /srv/host-stack/keycloak/inktavia-realm-realm.json:/opt/keycloak/data/import/inktavia-realm-realm.json:ro
      - /srv/host-stack/keycloak/providers/provider-otp-login-authenticator.jar:/opt/keycloak/providers/provider-otp-login-authenticator.jar:ro
      # FAZ22 (#87) — Inktavia login teması (branded + Türkçe). Diğer iki mount gibi salt-okunur.
      # ⚠️ #84 DRIFT: host kopyası (/srv/host-stack/keycloak/themes/inktavia) repo'daki
      #    infrastructure/keycloak/themes/inktavia'dan ELLE senkronlanır; kopyalanmazsa sessizce sapar
      #    (#62/#82'yi gizleyen sınıfın aynısı). Repo'yu değiştirince host'a da kopyalanmalı.
      # ⚠️ PROD'da temalar CACHE'lenir (KC production mode): tema değişikliği canlıya ancak container
      #    YENİDEN OLUŞTURULUNCA yansır — `restart` YETMEZ (bkz. Task C host checklist'i).
      - /srv/host-stack/keycloak/themes/inktavia:/opt/keycloak/themes/inktavia:ro
    networks: [aizen]

  # Tek seferlik: client'ları, secret'ları ve OTP akışını kurar.
  # Varsayılan olarak ÇALIŞMAZ; gerektiğinde:
  #   docker compose -f docker-compose.prod.yaml --profile init up keycloak-init
  keycloak-init:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak-init
    restart: "no"
    profiles: [init]
    logging: *default-logging
    depends_on:
      - keycloak
    entrypoint: ["/bin/bash", "/init/init.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      OTP_LOGIN_TICKET_SECRET: ${OTP_LOGIN_TICKET_SECRET}
      OTP_LOGIN_CONSUME_SECRET: ${OTP_LOGIN_CONSUME_SECRET}
      # Realm SMTP parolası (Resend). init.sh yalnız bu set ise smtpServer.password'u yazar; boşsa atlar.
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - /srv/host-stack/keycloak/init.sh:/init/init.sh:ro
    networks: [aizen]

networks:
  aizen:
    name: aizen
