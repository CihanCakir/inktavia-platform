# Namespace'ler, kaynak kotaları ve LimitRange'ler.
#
# Bunlar 2026-08-17'de elle kubectl ile kurulmuştu ve hiçbir yerde tanımlı değildi;
# cluster yeniden kurulsa kaybolurlardı. Buraya alındı.
#
# ⚠️ ResourceQuota TEK BAŞINA BİR TUZAKTIR: kotası olan bir namespace'te limit
# belirtmeyen HER pod reddedilir — test pod'ları dahil. LimitRange varsayılanları
# sağladığı için ikisi birlikte durmak zorunda.
#
# Kota değerleri ÖLÇÜME dayanıyor (2026-08-17):
#   15 servis gerçekte ~2,5Gi kullanıyor; 420Mi'ler tavan, rezervasyon değil.
#   Gerçek rezervasyon requests toplamı = ~2,4Gi.
#   9Gi seçildi çünkü 15 servisin tavan toplamı 5,8Gi ve rolling update sırasında
#   her güncellenen deployment geçici olarak İKİ pod çalıştırıyor. 7Gi ile iki
#   eşzamanlı güncelleme kotayı doldurup pod'ları Pending'de bırakıyordu.
---
apiVersion: v1
kind: Namespace
metadata:
  name: inktavia-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: inktavia-dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-cap
  namespace: inktavia-prod
spec:
  hard:
    # KAPALI ORTAM — kaynak açık olana verildi.
    # Bu değerler ortam-degistir.py tarafından yönetiliyor.
    limits.memory: 2Gi
    limits.cpu: "3"
    pods: "4"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-cap
  namespace: inktavia-dev
spec:
  hard:
    # AÇIK ORTAM. 15 servisin tavan toplamı ~4,2Gi; rolling update
    # sırasında her deployment geçici olarak İKİ pod çalıştırır.
    # Bu değerler ortam-degistir.py tarafından yönetiliyor.
    # cpu 10 -> 14 (2026-09-07): LT-5 CPU tavan gevşetmesi kullanımı 9,5'e çıkardı — 10'da
    # k6 Job'ı kotaya takıldı ve rollout surge'u kilitlenir olmuştu (node 12 çekirdek; bunlar
    # tavan, request degil — overcommit güvenli).
    # cpu 14 -> 18 (2026-09-09): LT-6 throttle ölçümü — identity %79, vessel/SR %50 throttle
    # yerken node toplamı ~2,2 çekirdekti; limitler +3,55 CPU dağıtıldı (identity 2000m,
    # vessel/SR 1000m, cargodry/referencedata 750m). Tavan gerçek darboğazdı, donanım değil.
    limits.memory: 8Gi
    limits.cpu: "18"
    pods: "32"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: inktavia-prod
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 320Mi
      defaultRequest:
        cpu: 50m
        memory: 200Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: inktavia-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 320Mi
      defaultRequest:
        cpu: 50m
        memory: 200Mi
