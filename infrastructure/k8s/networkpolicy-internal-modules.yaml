# ─────────────────────────────────────────────────────────────────────────────────────────────────────────
# Internal modules must not be reachable from outside the cluster.
#
# WHY THIS FILE IS A SECURITY CONTROL, NOT A NICETY:
# The Provider BFF is the authorization trust boundary. Modules do not see the end-user token — they trust the
# identity the BFF asserts (X-Aizen-User-Id / X-Aizen-Provider-Profile-Id, gated by a shared secret and the
# AllowedClientIds list). Anyone who can *reach a module* and holds the secret plus a valid service-account
# token can assert any user id. Network isolation is therefore part of the authentication design, not a layer
# on top of it.
#
# Apply to the namespace that runs the modules. Assumes a CNI that enforces NetworkPolicy (Calico, Cilium,
# etc.) — on a CNI that ignores it, this file is decoration; verify before relying on it.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: inktavia
spec:
  # Everything in the namespace is closed by default; the policies below re-open only what is needed.
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modules-allow-bff-only
  namespace: inktavia
spec:
  # Internal modules: identity, service-request, file-storage, reference-data, notification, vessel, …
  podSelector:
    matchLabels:
      aizen.io/tier: module
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Only the BFFs may call a module. Not the ingress controller, not the browser, not another namespace.
        - podSelector:
            matchLabels:
              aizen.io/tier: bff
      ports:
        - protocol: TCP
          port: 8080
    # Prometheus scraping — narrow, and separate, so "we need metrics" never becomes a reason to widen the rule
    # above.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-allow-ingress-controller
  namespace: inktavia
spec:
  # The BFFs are the ONLY pods the outside world may reach.
  podSelector:
    matchLabels:
      aizen.io/tier: bff
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
