# Inktavia login teması — Keycloak 25.
#
# ⚠️ parent=keycloak.v2 (v1 "keycloak" DEĞİL): v2 (PatternFly tabanlı) login teması KC25'in VARSAYILANIDIR;
#    OTP SPI'ının ürettiği formlar dahil canlı ekranlar onu kullanıyor. v1'e parent'lamak farklı bir HTML
#    iskelesi getirir ve o formları bozardı.
#
# ⚠️ styles: ÖNCE parent'ın kendi login.css'i (PatternFly + KC login temeli), SONRA bizim inktavia.css'imiz →
#    bizimki en son yüklenir ve renk/tipografiyi EZER. Kendi dosyamıza bilerek "login.css" ADINI VERMEDİK:
#    aynı ad parent'ın login.css'ini GÖLGELER (child kaynakları parent'ı yol bazında ezer) ve tüm PatternFly
#    temeli kaybolurdu. Ayrı ad = "parent'ınkine EKLE", "parent'ınkini DEĞİŞTİR" değil.
parent=keycloak.v2
import=common/keycloak
styles=css/login.css css/inktavia.css

# Isınma: kcHtmlClass gövdeye sınıf ekler; inktavia.css bunu değil, doğrudan .login-pf-page vb. hedefliyor.
