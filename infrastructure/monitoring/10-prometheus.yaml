# Prometheus — retention 7d, remote-write receiver ACIK (LT-5 k6 kosulari cluster icinden
# metrik basabilsin diye; lokal compose'daki kalipla ayni).
# RabbitMQ scrape'i BILEREK kapali-yorumda: host-stack rabbitmq'da prometheus plugin'i
# (15692) henuz acik degil — lokal compose'ta actik, sunucuda ayri is (enabled_plugins mount'u
# + konteyner recreate). Acilinca yorumu kaldir.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs: [{ role: node }]
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config: { insecure_skip_verify: true }
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']
      - job_name: postgres
        static_configs:
          - targets: ['postgres-exporter.monitoring.svc.cluster.local:9187']
      # - job_name: rabbitmq            # host rabbitmq'da prometheus plugin'i acilinca
      #   static_configs:
      #     - targets: ['192.168.1.50:15692']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.path=/prometheus
            - --web.enable-remote-write-receiver
          ports: [{ containerPort: 9090 }]
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 700Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}   # 7 gunluk retention; pod tasinirsa veri gider — Faz A'da kabul (kalicilik Faz C karari)
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
