# postgres_exporter — HOST Postgres'ini olcer. Adres icat ETMEZ: modullerin kullandigi
# selector'siz `postgres` Service'inin (inktavia-dev ns, EndpointSlice -> host IP) cluster
# DNS'i uzerinden gider.
# SIR OUT-OF-BAND (public repo — deger asla buraya girmez). Sunucuda, basinda BOSLUKLA:
#    kubectl -n monitoring create secret generic monitoring-credentials \
#      --from-literal=PG_EXPORTER_DSN='postgresql://aizen:<POSTGRES_PASSWORD>@postgres.inktavia-dev.svc.cluster.local:5432/inktavia_store_dev?sslmode=disable'
# (parola /srv/host-stack/.env'deki POSTGRES_PASSWORD; salt-okunur ayri rol ilerideki iyilestirme)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres-exporter } }
  template:
    metadata: { labels: { app: postgres-exporter } }
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_NAME
              valueFrom: { secretKeyRef: { name: monitoring-credentials, key: PG_EXPORTER_DSN } }
          ports: [{ containerPort: 9187 }]
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  selector: { app: postgres-exporter }
  ports: [{ port: 9187, targetPort: 9187 }]
