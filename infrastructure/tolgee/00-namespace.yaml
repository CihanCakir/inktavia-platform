# Tolgee ceviri platformu — kendi `tolgee` namespace'i + kaynak kotasi (2026-09-07).
#
# Neden ayri namespace: Tolgee ucuncu-parti bir uygulama (monorepo modulu degil), inktavia-dev
# kotasini ve NetworkPolicy'sini paylasmasin. monitoring yigininin desenini birebir izler
# (raw YAML + gitops/apps altinda tek bir Argo Application).
#
# ⚠️ ResourceQuota TEK BASINA TUZAK: kotasi olan ns'te limit belirtmeyen HER pod reddedilir
# (port-forward icin actigin gecici psql/debug pod'lari dahil). LimitRange varsayilanlari
# sagladigi icin ikisi birlikte durur.
#
# Kota matematigi (limits.memory, 2026-09-07 revizyonu): tolgee 2Gi (tavan) + ~512Mi gecici
# debug/psql pod'una pay = 2560Mi. requests.memory 1152Mi = tolgee 768Mi request + pay.
# ILK KURULUM DERSI: 1Gi tavanla pod OOMKilled oldu (Java 25 + Flyway boot'u; Tolgee'nin kendi
# onerisi 2GB) — "gerekirse birlikte artirilir" senaryosu ilk gun yasandi, ikisi birlikte artti.
# Node ayni gun ~9Gi available; tavanlar toplami buyudu ama gercek kullanim (request) kucuk.
apiVersion: v1
kind: Namespace
metadata:
  name: tolgee
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tolgee-quota
  namespace: tolgee
spec:
  hard:
    # 2026-09-07: 640Mi/1280Mi -> 1152Mi/2560Mi. Ilk kurulumda pod OOMKilled oldu (1Gi tavan,
    # Java 25 + Flyway boot'u yetmedi — Tolgee'nin kendi onerisi de 2GB). Node olcumu ayni gun
    # ~9Gi available; tavan 2,5Gi'ye cikti ama request'ler kucuk kaldi.
    requests.memory: 1152Mi
    limits.memory: 2560Mi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: tolgee
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 320Mi
      defaultRequest:
        cpu: 50m
        memory: 200Mi
