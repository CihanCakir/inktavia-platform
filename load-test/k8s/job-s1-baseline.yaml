# LT-5 — s1 token'li okuma, dev baseline kosumu (5→25 VU rampa + 5 dk sabit; ~8 dk).
# ON KOSUL + configmap/secret adimlari: job-s0-smoke.yaml basligindaki notlara bak.
# ONCE s0 yesil olmali; sonra:
#   kubectl apply -f load-test/k8s/job-s1-baseline.yaml
#   kubectl -n inktavia-dev logs -f job/k6-s1-baseline
#   kubectl -n inktavia-dev delete job k6-s1-baseline   # tekrar kosmadan once
#
# DIKKAT: s1'in p95 esikleri LOKAL baseline'dan kalibre (x1.5). Dev donanimi farkli —
# ilk kosumda esik asilirsa Job "Failed" gorunur ama metrikler Prometheus'a YAZILMIS olur;
# amac zaten dev baseline'ini olcmek. Dev esikleri bu kosumun p95'lerinden yeniden kalibre edilir.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-s1-baseline
  namespace: inktavia-dev
  labels: { app: k6-loadtest, scenario: s1-baseline }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: k6-loadtest, scenario: s1-baseline }
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.52.0
          args: ["run", "-o", "experimental-prometheus-rw", "/scripts/s1-token-read.js"]
          env:
            - name: PROFILE
              value: baseline
            - name: BASE_ADMIN
              value: http://aizen-bff-adminpanel.inktavia-dev.svc.cluster.local
            - name: BASE_PROVIDER
              value: http://aizen-bff-marineprovider.inktavia-dev.svc.cluster.local
            - name: KEYCLOAK_BASE
              value: http://keycloak.inktavia-dev.svc.cluster.local:8080
            - name: KC_REALM
              value: inktavia-realm
            - name: LOADTEST_USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: loadtest-credentials, key: LOADTEST_USER_PASSWORD }
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(95),p(99)"
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 256Mi }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: lib, mountPath: /scripts/lib, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: k6-scripts }
        - name: lib
          configMap: { name: k6-lib }
