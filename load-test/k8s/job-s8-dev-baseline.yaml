# LT-5 — s8 keşif (nearby marinas + radiusless provider discovery), DOYGUNLUK ALTI kalibrasyon
# (PROFILE=dev-baseline: 5 VU × 2dk). 20 VU okuma-ağırlıklı hedef profil (PROFILE=baseline) limits fix SONRASI.
# Provider discovery leg VARSAYILAN ATLANIR; onboarded provider varsa PROVIDER_USER env'ini ac (asagida yorumlu).
#   kubectl apply -f load-test/k8s/job-s8-dev-baseline.yaml
#   kubectl -n inktavia-dev logs -f job/k6-s8-dev-baseline
#   kubectl -n inktavia-dev delete job k6-s8-dev-baseline
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-s8-dev-baseline
  namespace: inktavia-dev
  labels: { app: k6-loadtest, scenario: s8-discovery-nearby }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: k6-loadtest, scenario: s8-discovery-nearby }
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.52.0
          args: ["run", "-o", "experimental-prometheus-rw", "/scripts/s8-discovery-nearby.js"]
          env:
            - name: PROFILE
              value: dev-baseline
            - name: BASE_MOBILE
              value: http://aizen-bff-marine-mobile.inktavia-dev.svc.cluster.local
            - name: BASE_PROVIDER
              value: http://aizen-bff-marineprovider.inktavia-dev.svc.cluster.local
            # - name: PROVIDER_USER            # onboarded (Approved+Active) provider loadtest kullanicisi.
            #   value: loadtest-provider-01@example.test   # ac → radiusless discovery leg de yuklenir.
            - name: KEYCLOAK_BASE
              value: http://keycloak.inktavia-dev.svc.cluster.local:8080
            - name: KC_REALM
              value: inktavia-realm
            - name: LOADTEST_USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: loadtest-credentials, key: LOADTEST_USER_PASSWORD }
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(95),p(99)"
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 256Mi }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: lib, mountPath: /scripts/lib, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: k6-scripts }
        - name: lib
          configMap: { name: k6-lib }
