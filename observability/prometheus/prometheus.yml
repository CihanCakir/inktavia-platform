global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'rabbitmq'
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']
    relabel_configs:
      - source_labels: ['__address__']
        target_label: instance
        regex: '(.*)'
        replacement: rabbitmq

  - job_name: 'gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080']

  - job_name: 'bff'
    metrics_path: /metrics
    static_configs:
      - targets: ['bff:8080']

  - job_name: 'identity-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['identity-api:8080']

  - job_name: 'profile-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['profile-api:8080']
