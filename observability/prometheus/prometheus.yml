# LT-0 (2026-09-03): hedefler fiilen metrik SUNAN servislerle sinirlandi.
# .NET servislerinde /metrics YOK (prometheus-net/OpenTelemetry eklenmedi) — eski gateway/bff/identity/profile
# hedefleri hicbir zaman UP olamiyordu, kaldirildi. Sunucu tarafi kaynak olcumu cAdvisor'dan,
# k6 kosu metrikleri remote-write'tan (prometheus --web.enable-remote-write-receiver) gelir.
# cadvisor yalniz `--profile loadtest` sirasinda ayakta olur; bos zamanda hedefin DOWN gorunmesi normaldir.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'rabbitmq'
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']
    relabel_configs:
      - source_labels: ['__address__']
        target_label: instance
        regex: '(.*)'
        replacement: rabbitmq

  - job_name: 'cadvisor'
    metrics_path: /metrics
    static_configs:
      - targets: ['cadvisor:8080']
